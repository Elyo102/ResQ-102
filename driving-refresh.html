<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>רענון נהיגה — ResQ</title><link rel="stylesheet" href="theme.css?v=42h47"><link rel="stylesheet" href="driving-refresh.css?v=dr1"></head>
<body data-resq-shell="v1" data-resq-page="driving-refresh"><main class="drive-wrap"><h1>רענון נהיגה</h1><p id="drive-identity">טוען את המשתמש המחובר…</p><p id="drive-status" role="status" aria-live="polite"></p><div id="drive-work" hidden>
<nav class="drive-tabs" aria-label="רענון נהיגה"><button data-view="report">דיווח</button><button data-view="mine">הדיווחים שלי</button><button data-view="shift" id="drive-manager" hidden>דוח מעקב משמרת</button></nav>
<section id="drive-report" class="drive-card"><h2 id="drive-form-title">דיווח רענון נהיגה</h2><p id="drive-time"></p><form id="drive-form"><label for="drive-vehicle">שם רכב *</label><input id="drive-vehicle" maxlength="120" required autocomplete="off"><label for="drive-hours">שעות נהיגה</label><select id="drive-hours" required></select><p>אפשר לדווח כמה פעמים ביום. התאריך והשעה נקבעים בשרת; עריכה אינה משנה את מועד היצירה.</p><button id="drive-save" type="submit">שמור דיווח</button><button id="drive-cancel" type="button" hidden>ביטול עריכה</button></form></section>
<section id="drive-mine" class="drive-card" hidden><h2>הדיווחים שלי</h2><p id="drive-annual"></p><div id="drive-own-list"></div><button id="drive-own-more" hidden>עוד דיווחים</button></section>
<section id="drive-shift" class="drive-card" hidden><h2>דוח מעקב רענון נהיגה</h2><div class="drive-filters"><label>חודש <input id="drive-month" type="month"></label><label>משמרת <select id="drive-crew"></select></label><button id="drive-load">טען דוח</button></div><div id="drive-summary"></div><div class="drive-scroll" id="drive-roster"></div><p>„דווח השנה” מציין קיום דיווח בשנה הלועזית בלבד, ואינו אישור כשירות.</p></section>
<section id="drive-history" class="drive-card" hidden><button id="drive-back">חזרה לדוח</button><h2 id="drive-history-name">היסטוריית נהג</h2><div id="drive-history-list"></div><button id="drive-history-more" hidden>עוד דיווחים</button></section>
</div></main><script type="module" src="driving-refresh.js?v=dr1"></script></body></html>

<!DOCTYPE html>

<head>

<title>ResQ — תחנה 102</title>
<link rel="icon" href="./favicon.ico" sizes="any">

<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1b33" media="(prefers-color-scheme: dark)">
<script>
/* המצב הנבחר מוחל לפני הציור הראשון. מודול נטען מאוחר מדי,
   והמשתמש היה רואה הבזק של הפלטה השנייה בכל מעבר מסך. */
(function(){try{var t=localStorage.getItem('resq_theme');
if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
}catch(e){}})();
</script>
<link rel="stylesheet" href="./theme.css?v=42g0">

<!-- הפניה אוטומטית למסך הכניסה. בלי הקובץ הזה, הכתובת הראשית
     של האתר מחזירה שגיאת 404, כי אין בריפו קובץ index. -->
<meta http-equiv="refresh" content="0; url=login.html">
<link rel="canonical" href="login.html">
<style>
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Segoe UI",Arial,sans-serif;
       min-height:100vh;display:flex;align-items:center;
       justify-content:center;text-align:center;padding:16px}
  a{color:var(--accent)}

</style>
</head>
<body>

  </div>
<script>location.replace('login.html');</script>
</body>
</html>

# Diagnostic evidence only. This does not run or attest the release gate.
name: Hours47 callout containment diagnostic only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hours47-callout-diagnostic-1263a05
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  GCLOUD_PROJECT: demo-resq
  GOOGLE_CLOUD_PROJECT: demo-resq
  FIREBASE_CONFIG: '{"projectId":"demo-resq"}'
  METADATA_SERVER_DETECTION: none
jobs:
  diagnostic:
    name: Non-release callout fixture diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESQ_CI_SCRATCH: ${{ github.workspace }}/../hours47-callout-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1263a05ef17440533c5f2ce11026b03fa61e4f5a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - name: Bind diagnostic evidence to the unchanged product
        id: scratch
        run: |
          test "$(dirname "$(realpath -m "$RESQ_CI_SCRATCH")")" = "$(dirname "$(realpath "$GITHUB_WORKSPACE")")"
          mkdir "$RESQ_CI_SCRATCH"
          export RESQ_CI_SCRATCH="$(realpath "$RESQ_CI_SCRATCH")"
          mkdir "$RESQ_CI_SCRATCH/containment"
          printf 'RESQ_CI_SCRATCH=%s\nTMPDIR=%s\n' "$RESQ_CI_SCRATCH" "$RESQ_CI_SCRATCH" >> "$GITHUB_ENV"
          printf 'scratch=%s\n' "$RESQ_CI_SCRATCH" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = 1263a05ef17440533c5f2ce11026b03fa61e4f5a
          test -z "$(git status --porcelain)"
          printf 'purpose=diagnostic-only-no-release-attestation\nproduct_sha=%s\nproduct_tree=%s\ncontrol_workflow_sha=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$GITHUB_SHA" | tee "$RESQ_CI_SCRATCH/product.txt"
      - name: Install locked fixture dependencies
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run only the original callout fixture with unchanged containment
        working-directory: tests
        run: |
          set -o pipefail
          unset FIREBASE_TOKEN GOOGLE_APPLICATION_CREDENTIALS RESQ_CHROMIUM FIREBASE_EMULATOR_HUB
          export RESQ_CONTAINMENT_DIR="$RESQ_CI_SCRATCH/containment"
          export NODE_OPTIONS="--require \"$GITHUB_WORKSPACE/tests/lib/network-guard.cjs\""
          node callout-console-browser.mjs 2>&1 | tee "$RESQ_CI_SCRATCH/fixture.log"
          node -e 'const g=require("./lib/network-guard.cjs");g.assertActive();g.assertClean()'
      - name: Preserve diagnostic log and sticky ledger even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hours47-diagnostic-only-1263a05-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ steps.scratch.outputs.scratch }}/product.txt
            ${{ steps.scratch.outputs.scratch }}/fixture.log
            ${{ steps.scratch.outputs.scratch }}/containment/**

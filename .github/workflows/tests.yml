# ============================================================
#  בדיקות אוטומטיות על כל דחיפה
# ============================================================
#  עד עכשיו הבדיקות רצו רק כשמישהו זכר להריץ אותן ידנית.
#  ב-24.8.2026 שלוש פריסות רצופות נכשלו מסיבות שכל אחת מהן
#  הייתה נתפסת כאן בשלושים שניות: קובץ שלא הועתק, ספרייה
#  שלא הותקנה, קובץ נעילה לא מסונכרן.
#
#  שתי משרות במקביל. הראשונה מהירה ובודקת קוד; השנייה מרימה
#  Firestore אמיתי ובודקת את כללי האבטחה - זו שבלעדיה כלל
#  שגוי היה מגיע לייצור בשקט.
# ============================================================

name: בדיקות

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # אפשר גם להריץ ידנית מהלשונית Actions

jobs:

  # ---------- קוד, מסכים וחוקיות עסקית ----------
  app:
    name: קוד ומסכים
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: התקנת תלויות הבדיקה
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # בדיקות סטטיות. מהירות, ותופסות את מחלקת הבאגים
      # שנושכת ביום הפריסה: שם שדה בכלל שלא תואם לשם בקוד,
      # קריאה לפונקציה שלא קיימת, נתיב שנשבר.
      - name: בדיקות סטטיות
        working-directory: tests
        run: npm run static

      # מריצות דפדפן אמיתי מול Firebase מזויף, בשישה תפקידים.
      - name: מסכים, תפקידים, חוקיות עסקית וניגודיות
        working-directory: tests
        run: npm run browser

      - name: היסטוריית צי ורכב שהורד משירות
        working-directory: tests
        run: npm run fleet:history

      # סריקה נפרדת של כל דפי ה-HTML ברוחב טלפון. בדיקות הדפדפן
      # הרגילות מכסות מסכים ממוקדים בלבד ואינן מחליפות שער overflow מלא.
      - name: כל המסכים ברוחב טלפון
        working-directory: tests
        run: npm run browser:mobile

  # ---------- כללי האבטחה ----------
  rules:
    name: כללי אבטחה
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # אמולטור Firestore הוא תוכנית Java. בלעדיה הכללים
      # לא מהודרים כאן, וחוזרים למצב שבו הוודאות היחידה
      # היא שהפריסה לא צעקה.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: התקנת firebase-tools
        run: npm install -g firebase-tools@15.28.1

      - name: התקנת תלויות
        working-directory: rules-test
        run: npm ci --no-audit --no-fund

      - name: התקנת תלויות פונקציות
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: כללי האבטחה מול Firestore מקומי
        run: firebase emulators:exec --only firestore --project demo-resq "cd rules-test && npm test"

      - name: פונקציות לוח המודעות מול Firestore מקומי
        run: firebase emulators:exec --only firestore --project demo-resq "cd functions && node bulletin.integration.test.js"

      - name: HR report reads and live identity fences
        env:
          GCLOUD_PROJECT: demo-resq
        run: firebase emulators:exec --only firestore --project demo-resq "node functions/hr-hours-service.integration.test.js"

      - name: HR requests actual callable registration and private telemetry
        run: node tests/hr-requests-wiring.mjs

      - name: HR documents and hours actual release wiring
        run: npm --prefix tests run hr:release:wiring

      - name: HR durable notifications and documents against Firestore
        env:
          GCLOUD_PROJECT: demo-resq
        run: firebase emulators:exec --only firestore --project demo-resq "node functions/hr-hours-nudges.integration.test.js && node functions/hr-hours-dispatch.integration.test.js && node functions/hr-hours-nudge-status.integration.test.js && node functions/hr-documents.integration.test.js"

      - name: HR private requests against Firestore
        env:
          GCLOUD_PROJECT: demo-resq
        run: firebase emulators:exec --only firestore --project demo-resq "node functions/hr-requests.integration.test.js"

      - name: פעולות זהות והרשמה מול Firestore מקומי
        run: firebase emulators:exec --only firestore --project demo-resq "cd functions && npm run test:identity"

      - name: העברת עובדים בין תחנות מול Firestore מקומי
        run: firebase emulators:exec --only firestore --project demo-resq "cd functions && node station-transfer.integration.test.js"

      - name: נוכחות Shadow מול Firestore מקומי
        run: firebase emulators:exec --only firestore --project demo-resq "cd functions && node attendance-shadow.integration.test.js"

      - name: הזמנות חד-פעמיות מול Firestore מקומי
        run: firebase emulators:exec --only firestore --project demo-resq "cd functions && node invitations.integration.test.js"

      - name: מנוע סידור חודשי מול Firestore מקומי
        run: firebase emulators:exec --only firestore --project demo-resq "cd functions && node schedule-runtime.integration.test.js"

      # ⭐ נתיבי הכתיבה החדשים של 42G — מדיניות, מקור, מצב ומעבר —
      # מול Firestore אמיתי. עד לכאן הם נבדקו מול double בלבד.
      - name: כתיבת חוקי תחנה, מקור ומעבר לחי מול Firestore מקומי
        run: firebase emulators:exec --only firestore --project demo-resq "cd functions && node schedule-authoring.integration.test.js"

      # ⭐ 42H — הדבקת הגיליון: דוח → טיוטה → פרסום → לוח עם היעדרויות,
      # והמרוצים של ביקורת v2 (ביטול מינוי בזמן קריאה; ניסיון חוזר).
      - name: הדבקת הגיליון כטיוטה מול Firestore מקומי
        run: firebase emulators:exec --only firestore --project demo-resq "cd functions && node schedule-sheet-import.integration.test.js"

      # ⭐ 42H.2 — עריכת סידור שפורסם: טיוטה נגזרת → revision חדש עם CAS,
      # יומן, outbox אחד לאדם, ניסיון חוזר, בסיס ישן נדחה, rollback.
      - name: עריכת סידור שפורסם מול Firestore מקומי
        run: firebase emulators:exec --only firestore --project demo-resq "cd functions && node schedule-edit.integration.test.js"

      # ⭐ 42H.2 — קטלוג כשירויות ומחזיקים: CAS, יומן, מחיקה נחסמת כשבשימוש.
      - name: קטלוג כשירויות מול Firestore מקומי
        run: firebase emulators:exec --only firestore --project demo-resq "cd functions && node schedule-qualifications.integration.test.js"

      # ⭐ 42H.2 — בקרת פערים: קריטי חוסם, אחר עם אישור חתום, מועמדים בלבד.
      - name: בקרת פערים מול Firestore מקומי
        run: firebase emulators:exec --only firestore --project demo-resq "cd functions && node schedule-gaps.integration.test.js"

      - name: Monitoring and feedback transactions and deny rules
        env:
          NODE_PATH: ${{ github.workspace }}/rules-test/node_modules
        run: firebase emulators:exec --only firestore --project demo-resq "node functions/ops.integration.test.js"

name: Multi-Agent Autonomous PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]
  pull_request_target:
    types: [labeled]
    branches: [main, dev]

permissions: {}
concurrency:
  group: agent-review-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  local-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test .github/scripts/multi-agent-review.test.mjs
      - run: npm --prefix tests ci --no-audit --no-fund
      - run: npm --prefix rules-test ci --no-audit --no-fund
      - run: npm --prefix functions ci --no-audit --no-fund
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools@15.28.1 --no-audit --no-fund
      - working-directory: tests
        run: npx playwright install --with-deps chromium
      - working-directory: tests
        env:
          GCLOUD_PROJECT: demo-resq
        run: firebase emulators:exec --config ../firebase.attendance-test.json --only firestore --project demo-resq "npm run test:all"
      # The existing tests.yml Rules job remains mandatory and unchanged.
  review:
    if: github.event_name == 'pull_request_target' && vars.MULTI_AGENT_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Privileged job: NEVER check out or execute the PR head, its dependencies,
      # artifacts, actions or configuration. Bootstrap requires reviewed base code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Bounded review of PR data (no PR code execution)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_REVIEW_MODEL: ${{ vars.ANTHROPIC_REVIEW_MODEL }}
          XAI_REVIEW_MODEL: ${{ vars.XAI_REVIEW_MODEL }}
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL }}
          REVIEW_TRUSTED_ACTORS: ${{ vars.REVIEW_TRUSTED_ACTORS }}
        run: node .github/scripts/multi-agent-review.mjs

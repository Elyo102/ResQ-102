<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResQ — סידור עבודה</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="./resq-180.png">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1b33" media="(prefers-color-scheme: dark)">
<script>
/* המצב הנבחר מוחל לפני הציור הראשון. מודול נטען מאוחר מדי,
   והמשתמש היה רואה הבזק של הפלטה השנייה בכל מעבר מסך. */
(function(){try{var t=localStorage.getItem('resq_theme');
if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
}catch(e){}})();
</script>
<link rel="stylesheet" href="./theme.css?v=29">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ResQ">
<meta name="mobile-web-app-capable" content="yes">


<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Segoe UI",Arial,sans-serif;padding:18px}
  /* רחב כברירת מחדל. הלוח הזה נקרא ממחשב בתחנה וגם מטלפון,
     ובמחשב עמודה של 560 פיקסלים באמצע מסך רחב היא בזבוז —
     הריבועים יוצאים קטנים והתגיות נדחסות. */
  .wrap{max-width:1180px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .top .me{font-size:15px;font-weight:600}
  .top .sub{font-size:12px;color:var(--muted)}
  .lnk{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;
       text-decoration:underline;font-family:inherit;padding:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:14px;margin-bottom:12px}

  .next{display:flex;align-items:center;gap:12px}
  .next .big{font-size:26px;font-weight:700;color:var(--accent);line-height:1}
  .next .txt{font-size:13px;color:var(--muted);line-height:1.7}
  .next .txt b{color:var(--txt)}

  .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .nav button{background:transparent;border:1px solid var(--line);color:var(--txt);
        border-radius:6px;padding:6px 14px;font-size:16px;cursor:pointer;font-family:inherit}
  .nav .mo{font-size:16px;font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}

  /* שורת הימים היא כותרת, לא הערת שוליים. גם שמות מלאים ולא
     אותיות: «ג» כשם יום ו«ג'» כשם משמרת באותו מסך היו מבלבלים. */
  #dows{background:var(--chip);border:1px solid var(--line);border-radius:9px;
        padding:9px 0;margin-bottom:8px;gap:5px}
  .dow{font-size:15.5px;font-weight:700;color:var(--txt);text-align:center;
       line-height:1.2}
  .dow.rest{color:var(--accent)}
  @media (max-width:420px){
    .dow{font-size:11.5px}
    #dows{padding:7px 0}
  }
  .day{aspect-ratio:1.25;min-height:72px;
       border:1px solid var(--line);border-radius:10px;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:6px;font-size:13px;background:var(--panel);position:relative}
  .day.pad{border:0;background:transparent}
  /* אבטחה. נקודה בפינה — היום כבר נושא צבע משמרת, ועוד רקע
     היה מתחרה בו. */
  .day .gd{position:absolute;inset-block-start:5px;inset-inline-start:5px;
           width:7px;height:7px;border-radius:50%;background:#7cb342}
  .day .n{font-weight:700;font-size:22px;line-height:1;
          font-variant-numeric:tabular-nums}

  /* תג המשמרת. האות נשארת תמיד, גם כשיש צבע: כ-8% מהגברים
     אינם מבחינים בין אדום לירוק, וא' מול ב' הן בדיוק הזוג הזה.
     הצבע מזרז את הקריאה, האות מחזיקה את המידע. */
  .day .c{font-size:13px;font-weight:800;line-height:1;
          padding:4px 10px;border-radius:6px;border:1px solid transparent}
  .day.A .c{color:var(--crewA);background:var(--crewA-bg);border-color:var(--crewA)}
  .day.B .c{color:var(--crewB);background:var(--crewB-bg);border-color:var(--crewB)}
  .day.C .c{color:var(--crewC);background:var(--crewC-bg);border-color:var(--crewC)}

  /* המשמרת שלי — רמת הדגשה שנייה: מילוי ומסגרת עבה.
     אם כל שלוש המשמרות צבועות באותה עוצמה הלוח הופך לפסיפס
     ואי אפשר לסרוק אותו. */
  .day.mine{border-width:2px}
  .day.mine.A{background:var(--crewA-bg);border-color:var(--crewA)}
  .day.mine.B{background:var(--crewB-bg);border-color:var(--crewB)}
  .day.mine.C{background:var(--crewC-bg);border-color:var(--crewC)}
  .day.mine .c{background:transparent}

  .day.today{outline:2px solid var(--txt);outline-offset:2px}

  /* יום שהמשמרת שלו אינה כשירה. סימון פינתי קטן ולא צבע מילוי:
     הצבע כבר תפוס לזהות המשמרת, ואם נצבע גם כשירות באותו כלי
     אי אפשר יהיה לקרוא אף אחד מהשניים. */
  .day.unfit::after{content:'';position:absolute;top:5px;inset-inline-end:5px;
                    width:7px;height:7px;border-radius:50%;
                    background:var(--bad,var(--bad));
                    box-shadow:0 0 0 2px var(--panel)}
  .day.mine.unfit::after{box-shadow:0 0 0 2px rgba(0,0,0,.35)}

  /* יום עם חריגה. משולש קטן בפינה הנגדית לנקודת הכשירות,
     כדי ששני הסימונים לא יתנגשו על אותו יום. */
  .day.ovr::before{content:'';position:absolute;top:0;inset-inline-start:0;
                   border-width:0 0 12px 12px;border-style:solid;
                   border-color:transparent transparent var(--warn) transparent;
                   border-start-start-radius:9px}
  .day.ovr.swap::before{border-bottom-color:var(--pick)}

  .ovr-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .ovr-form .wide{grid-column:1 / -1}
  .ovr-form select,.ovr-form input{width:100%;padding:9px;background:var(--input);
       color:var(--txt);border:1px solid var(--line);border-radius:6px;
       font-size:14px;font-family:inherit}
  .ovr-list{margin-top:12px}
  .ovr-row{display:flex;align-items:center;gap:9px;padding:8px 0;
           border-bottom:1px solid var(--line-soft);font-size:13px}
  .ovr-row:last-child{border-bottom:0}
  .ovr-row .d{font-variant-numeric:tabular-nums;font-weight:700;width:64px;flex:none}
  .ovr-row .k{color:var(--muted);flex:none}
  .ovr-row .n{color:var(--muted);flex:1;min-width:0;overflow:hidden;
              text-overflow:ellipsis;white-space:nowrap}
  .ovr-row .x{color:var(--muted);cursor:pointer;padding:0 6px}
  .ovr-row .x:hover{color:var(--bad)}
  .btn-s{background:transparent;border:1px solid var(--line);color:var(--muted);
         border-radius:6px;padding:9px 16px;font-size:13px;cursor:pointer;
         font-family:inherit;margin-top:10px}
  .btn-s.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  .fit{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .fit .p{flex:1 1 150px;border:1px solid var(--line);border-radius:9px;
          padding:9px 11px;background:var(--panel)}
  .fit .p.bad{border-color:var(--bad);background:var(--bad-bg)}
  .fit .p .h{display:flex;align-items:center;gap:7px;font-size:13px;
             font-weight:700;margin-bottom:3px}
  .fit .p .tag{font-size:11px;font-weight:800;border-radius:5px;padding:2px 7px;
               color:var(--on-accent)}
  .fit .p .tag.A{background:var(--crewA)}
  .fit .p .tag.B{background:var(--crewB);color:var(--crewB-on)}
  .fit .p .tag.C{background:var(--crewC)}
  .fit .p .s{font-size:12px;color:var(--soft-bad);line-height:1.6}
  .fit .p .s.ok{color:var(--muted)}
  .fit .note{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.7}
  /* טלפון: חוזרים לריבוע. ריבוע רחב על מסך צר גוזל גובה
     ודוחף את הסיכום מתחת לקיפול. */
  @media (max-width:700px){
    .day{aspect-ratio:1;min-height:0;gap:4px;border-radius:9px}
    .day .n{font-size:16px}
    .day .c{font-size:11px;padding:3px 7px}
    .grid{gap:5px}
  }
  @media (max-width:420px){
    .day .n{font-size:14px}
    .day .c{font-size:10px;padding:2px 5px}
    .dow{font-size:11.5px}
  }

  /* הסיכום לא נמתח לרוחב הלוח. שני מספרים ברוחב 1180 פיקסלים
     נראים כמו באנר, לא כמו סיכום. */
  .sum{display:flex;gap:10px;margin-top:14px;max-width:420px;
       margin-inline-start:auto;margin-inline-end:auto}
  .sum div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:10px;text-align:center}
  .sum .v{font-size:20px;font-weight:700}
  .sum .k{font-size:11px;color:var(--muted);margin-top:2px}

  .legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:11px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:4px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

  .center{text-align:center;color:var(--muted);padding:26px 0;font-size:14px}
  .hide{display:none}
  input{width:100%;padding:11px;background:var(--input);color:var(--txt);
        border:1px solid var(--line);border-radius:6px;font-size:15px;font-family:inherit}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  button.main{width:100%;background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;
        padding:12px;font-size:15px;cursor:pointer;margin-top:18px;font-family:inherit}
  .err{margin-top:14px;padding:11px;border-radius:6px;font-size:13px;
       background:var(--err-bg);color:var(--err-fg);display:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- כניסה -->
  <div id="authView" class="card hide">
    <div style="text-align:center;font-size:19px;font-weight:600;margin-bottom:4px">תחנה 102</div>
    <div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:14px">הסידור שלי</div>
    <label>מייל</label>
    <input type="email" id="email" autocomplete="username">
    <label>סיסמה</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button class="main" id="btnIn">כניסה</button>
    <div class="err" id="authErr"></div>
  </div>

  <div class="card center hide" id="blocked"></div>

  <!-- תצוגה -->
  <div id="mainView" class="hide">

    <div class="top">
      <div>
        <div class="me" id="meName"></div>
        <div class="sub" id="meSub"></div>
      </div>
      <button class="lnk" id="btnOut">התנתק</button>
    </div>

    <div class="card">
      <div class="next" id="nextBox"></div>
    </div>

    <div class="card" id="fitCard" style="display:none">
      <div style="font-size:14px;font-weight:700;margin-bottom:9px">כשירות המשמרות</div>
      <div class="fit" id="fitBoxes"></div>
      <div class="note" id="fitNote"></div>
    </div>

    <div class="card">
      <div class="nav">
        <button id="prev">‹</button>
        <div class="mo" id="moLabel"></div>
        <button id="next">›</button>
      </div>
      <div class="grid" id="dows"></div>
      <div class="grid" id="grid"></div>

      <div class="sum">
        <div><div class="v" id="sumShifts">—</div><div class="k">משמרות בחודש</div></div>
        <div><div class="v" id="sumHours">—</div><div class="k">שעות</div></div>
      </div>

      <div class="legend">
        <span><i class="dot" style="background:var(--crewA)"></i>א'</span>
        <span><i class="dot" style="background:var(--crewB)"></i>ב'</span>
        <span><i class="dot" style="background:var(--crewC)"></i>ג'</span>
        <span><i class="dot" style="background:var(--crewC);
              border:2px solid var(--txt)"></i>המשמרת שלי</span>
        <span><i class="dot" style="background:var(--bad)"></i>לא כשירה</span>
        <span><i class="dot" style="background:var(--warn)"></i>חריגה</span>
      </div>
    </div>

    <div class="card hide" id="ovrCard">
      <div style="font-size:14px;font-weight:700;margin-bottom:3px">חריגות בסידור</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.7">
        המחזור הוא נוסחה שלא נשברת. חריגה גוברת עליו — בלוח,
        בסימון הכשירות ובמילוי דוח הנוכחות.
      </div>

      <div class="ovr-form">
        <select id="ovKind"></select>
        <input type="date" id="ovDate">
        <select id="ovCrew" class="wide"></select>
        <input type="text" id="ovNote" class="wide" maxlength="60" placeholder="סיבה (לא חובה)">
      </div>
      <button class="btn-s go" id="ovAdd">הוסף חריגה</button>

      <div class="ovr-list" id="ovList"></div>
      <div class="err" id="ovErr"></div>
    </div>

    <div class="card" id="noRot" style="display:none">
      <div class="center">עדיין לא הוגדר מחזור סידור בתחנה.</div>
    </div>

  </div>
</div>

<script type="module">
import { firebaseConfig, STATION_ID } from './firebase-config.js?v=29';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, setDoc, deleteDoc,
         serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { renderNav, clearNav, renderStuckNav } from './nav.js?v=29';
import { initPWA } from './pwa.js?v=29';
import { watchCallouts } from './callout.js?v=29';
import { isAssigned as guardHasMe } from './guards.js?v=29';
import { CREW_HE, CREW_SHORT, crewOnDate, shiftsInMonth, hoursInMonth,
         nextShift, shiftTimes, sameDay, daysBetween, toKey,
         OVERRIDE_KINDS, overrideKindHe, overrideOn,
         personWorks, swapEffect }
  from './rotation.js?v=29';
import { CREWS, redlineState, boardState, crewReady, summaryText, visibleCrews }
  from './readiness.js?v=29';

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);
initPWA({ offer: false });

// אין מסך כניסה בכל דף. יש אחד, והוא login.html.
//
// הגרסה הקודמת שכפלה טופס כניסה לכל מסך — וכל אחד מהם ידע
// לקבל מייל בלבד, בעוד המסך הראשי מקבל גם מספר עובד. התוצאה:
// מי שהקליד את מספר העובד שלו כאן נדחה בלי סיבה מובנת.
// מסך חסימה גלוי, במקום הודעה שנכתבת לתוך טופס כניסה מת.
function showBlocked(text){
  $('authView').classList.add('hide');
  $('mainView').classList.add('hide');
  const box = $('blocked');
  box.textContent = text;
  box.classList.remove('hide');
}

function goSignIn(){
  const back = encodeURIComponent(location.pathname.split('/').pop() || '');
  location.replace('./login.html?next=' + back);
}


// הסרגל נבנה מיד, לפני כל קריאה לשרת. בגרסה הקודמת הוא נבנה
// רק אחרי שהפרופיל נטען — ואם הטעינה איטית, נכשלת, או שהמשתמש
// נחסם, לא היה תפריט בכלל ולא הייתה דרך לצאת מהמסך.
renderStuckNav('');


const ROLE_HE = {
  firefighter: 'לוחם אש',
  deputy: 'סגן מפקד משמרת',
  commander: 'קצין / מפקד משמרת',
  station_commander: 'מפקד תחנה',
  hr_coordinator: 'רכז/ת משאבי אנוש'
};
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני',
                'יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DOWS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

let me = null;
let rotations = [];
let viewYear, viewMonth;

// כשירות המשמרות. נטענת פעם אחת ומחושבת פעם אחת לכל משמרת —
// לא לכל יום. שלושים יום של אותה משמרת הם אותה תשובה.
let fit = {};        // crew -> {rl, bs, verdict}
let qualNames = {};  // qid -> שם
let myCrews = CREWS.slice();
let overrides = {};      // 'YYYY-MM-DD' -> {kind, crew, extra_crews, note}
let mySwaps = [];        // החלפות מאושרות
let myGuards = [];       // אבטחות שאני משובץ אליהן
let canEditOvr = false;
let SID = '';

// ---------- כניסה ----------

$('btnIn').onclick = async () => {
  const btn = $('btnIn');
  btn.disabled = true;
  $('authErr').style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, $('email').value.trim().toLowerCase(), $('pass').value);
  } catch (e) {
    $('authErr').textContent = 'מייל או סיסמה שגויים.';
    $('authErr').style.display = 'block';
  }
  btn.disabled = false;
};

$('btnOut').onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (!user) { goSignIn(); return; }

  let claims = {};
  try { claims = (await user.getIdTokenResult()).claims || {}; } catch (ignore) {}

  try {
    // התחנה מגיעה מהטוקן. הקבוע שימש כברירת מחדל בלבד, וכל כבאי
    // שאינו באילת היה נתקע כאן במסך שגיאה בלי דרך המשך.
    const sid = claims.stationId || STATION_ID;
    const s = await getDoc(doc(db, 'stations', sid, 'users', user.uid));
    if (!s.exists()) {
      renderStuckNav(user.email || '');
      showBlocked('החשבון אינו משויך לכבאי בתחנה הזו. פנה למנהל המערכת.');
      return;
    }
    me = s.data();
  } catch (e) {
    renderStuckNav(user.email || '');
    showBlocked('שגיאה בטעינת הפרופיל: ' + (e.code || e.message || ''));
    return;
  }

  SID = claims.stationId || STATION_ID;
  canEditOvr = claims.super === true || claims.role === 'super_admin' ||
               ['deputy', 'commander', 'station_commander', 'hr_coordinator'].indexOf(claims.role) !== -1;

  try {
    const rs = await getDocs(collection(db, 'stations', SID, 'rotations'));
    rotations = rs.docs.map(d => d.data());
  } catch (e) {
    // הבחנה חשובה: "אין מחזור" ו"אין לך הרשאה לקרוא" נראים אותו
    // דבר כשבולעים את השגיאה, ומי שנחסם חושב שהתחנה לא הוגדרה.
    rotations = [];
    if (String(e.code || '').indexOf('permission-denied') !== -1) {
      renderStuckNav(user.email || '');
      showBlocked('אין לך הרשאה לקרוא את סידור התחנה הזו.');
      return;
    }
  }

  await loadOverrides();
  try {
    const sw = await getDocs(collection(db, 'stations', SID, 'swaps'));
    mySwaps = [];
    sw.forEach(d => {
      const v = d.data() || {};
      if (v.status === 'approved') mySwaps.push(v);
    });
  } catch (ignore) {}

  // אבטחות. הן נשמרות עם תאריך בלבד, ולכן הן נופלות ליומן
  // מעצמן — אין כאן שיבוץ ידני ואין לוח נפרד לתחזק.
  try {
    const uid = auth.currentUser ? auth.currentUser.uid : '';
    const gs = await getDocs(collection(db, 'stations', SID, 'guards'));
    myGuards = [];
    gs.forEach(d => {
      const v = Object.assign({ id: d.id }, d.data() || {});
      if (v.status === 'cancelled') return;
      if (guardHasMe(v, uid)) myGuards.push(v);
    });
  } catch (ignore) {}

  $('meName').textContent = me.full_name;
  $('meSub').textContent  = (ROLE_HE[me.role] || me.role) +
                            (me.crew ? ' · ' + CREW_HE[me.crew] : '');

  renderNav(claims, 'schedule.html',
            (me.full_name || user.email || '') +
            (claims.emp ? ' · מס׳ ' + claims.emp : ''));

  watchCallouts(db, SID, user.uid, { name: me.full_name || user.email || '' });

  $('authView').classList.add('hide');
  $('mainView').classList.remove('hide');

  const now = new Date();
  viewYear  = now.getFullYear();
  viewMonth = now.getMonth();

  if (canEditOvr) {
    $('ovrCard').classList.remove('hide');
    setupOvrForm();
  }

  renderNext();
  render();

  // הכשירות נטענת אחרי הלוח, לא לפניו. אם הקריאה איטית או
  // נכשלת, הסידור עצמו כבר על המסך — הוא לא ממתין לה.
  myCrews = visibleCrews(claims);
  await loadFitness(claims.stationId || STATION_ID);
  renderFitness();
  render();
});

// ---------- חריגות ----------

async function loadOverrides(){
  overrides = {};
  try {
    const os = await getDocs(collection(db, 'stations', SID, 'shift_overrides'));
    os.forEach(function (d) {
      const v = d.data() || {};
      overrides[d.id] = {
        kind: v.kind || 'holiday',
        crew: v.crew || '',
        extra_crews: Array.isArray(v.extra_crews) ? v.extra_crews : [],
        note: v.note || ''
      };
    });
  } catch (ignore) {}
}

function setupOvrForm(){
  $('ovKind').innerHTML = OVERRIDE_KINDS
    .map(k => '<option value="' + k.id + '">' + k.he + '</option>').join('');

  const crewOpts = '<option value="">בלי שינוי במשמרת</option>' +
    CREWS.map(c => '<option value="' + c + '">משמרת ' + CREW_HE[c] + '</option>').join('');
  $('ovCrew').innerHTML = crewOpts;

  const today = new Date();
  $('ovDate').value = today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');

  $('ovKind').onchange = syncOvrForm;
  syncOvrForm();
  $('ovAdd').onclick = addOverride;
  renderOvrList();
}

// החלפה חייבת לומר מי עובד. כוננות מוסיפה משמרות. חג ואימון
// לא נוגעים במי עובד — ולכן שדה המשמרת בהם רק מבלבל.
function syncOvrForm(){
  const kind = $('ovKind').value;
  const sel  = $('ovCrew');
  if (kind === 'swap') {
    sel.style.display = '';
    sel.options[0].textContent = 'בחר מי עובד במקום';
  } else if (kind === 'standby') {
    sel.style.display = '';
    sel.options[0].textContent = 'איזו משמרת מתווספת';
  } else {
    sel.style.display = 'none';
    sel.value = '';
  }
}

function ovErr(text){
  const e = $('ovErr');
  e.textContent = text || '';
  e.style.display = text ? 'block' : 'none';
}

async function addOverride(){
  ovErr('');
  const date = $('ovDate').value;
  const kind = $('ovKind').value;
  const crew = $('ovCrew').value;
  const note = $('ovNote').value.trim();

  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { ovErr('צריך תאריך.'); return; }
  if (kind === 'swap' && !crew) { ovErr('בהחלפה צריך לבחור מי עובד.'); return; }
  if (kind === 'standby' && !crew) { ovErr('בכוננות צריך לבחור איזו משמרת מתווספת.'); return; }

  const rec = {
    kind: kind,
    crew: kind === 'swap' ? crew : '',
    extra_crews: kind === 'standby' ? [crew] : [],
    note: note
  };

  $('ovAdd').disabled = true;
  try {
    await setDoc(doc(db, 'stations', SID, 'shift_overrides', date),
                 Object.assign({ date: date, updated_at: serverTimestamp(),
                                 by: auth.currentUser.uid }, rec));
    overrides[date] = rec;
    $('ovNote').value = '';
    renderOvrList();
    renderNext();
    render();
  } catch (e) {
    ovErr('השמירה נכשלה. (' + (e.code || e.message) + ')');
  }
  $('ovAdd').disabled = false;
}

async function removeOverride(date){
  try {
    await deleteDoc(doc(db, 'stations', SID, 'shift_overrides', date));
    delete overrides[date];
    renderOvrList();
    renderNext();
    render();
  } catch (e) {
    ovErr('המחיקה נכשלה. (' + (e.code || e.message) + ')');
  }
}

function renderOvrList(){
  const box = $('ovList');
  box.innerHTML = '';
  const keys = Object.keys(overrides).sort();
  if (!keys.length) {
    box.innerHTML = '<div style="font-size:12.5px;color:var(--muted);' +
                    'padding-top:10px">אין חריגות מוגדרות.</div>';
    return;
  }
  keys.forEach(function (k) {
    const o = overrides[k];
    const p = k.split('-');
    const row = document.createElement('div');
    row.className = 'ovr-row';
    row.innerHTML =
      '<span class="d">' + Number(p[2]) + '.' + Number(p[1]) + '</span>' +
      '<span class="k">' + overrideKindHe(o.kind) +
        (o.crew ? ' · ' + CREW_HE[o.crew] : '') +
        (o.extra_crews && o.extra_crews.length
          ? ' · + ' + o.extra_crews.map(c => CREW_HE[c]).join(', ') : '') +
      '</span>' +
      '<span class="n">' + (o.note || '') + '</span>';
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '✕'; x.title = 'מחק';
    x.onclick = () => removeOverride(k);
    row.appendChild(x);
    box.appendChild(row);
  });
}

// ---------- כשירות ----------

async function loadFitness(sid){
  const people = [], held = {};
  let redline = null, board = null;
  const assigns = {};

  try {
    const qs = await getDocs(collection(db, 'stations', sid, 'quals'));
    qs.forEach(d => { qualNames[d.id] = (d.data() || {}).name || ''; });
  } catch (ignore) {}

  try {
    const rs = await getDocs(collection(db, 'stations', sid, 'roster'));
    rs.forEach(d => {
      const v = d.data() || {};
      if (v.is_active === false) return;
      people.push({ uid: d.id, crew: v.crew || '' });
    });
  } catch (ignore) {}

  try {
    const ms = await getDocs(collection(db, 'stations', sid, 'member_quals'));
    ms.forEach(d => {
      const v = d.data() || {};
      held[d.id] = Array.isArray(v.quals) ? v.quals : [];
    });
  } catch (ignore) {}

  try {
    const r = await getDoc(doc(db, 'stations', sid, 'config', 'redline'));
    if (r.exists()) redline = r.data();
  } catch (ignore) {}

  try {
    const b = await getDoc(doc(db, 'stations', sid, 'config', 'board'));
    if (b.exists()) board = b.data();
  } catch (ignore) {}

  // רק המשמרות שמותר לי לראות. קריאה למשמרת אחרת תיחסם בשרת,
  // ואין טעם לשלוח בקשה שאני יודע מראש שתידחה.
  for (const crew of myCrews) {
    try {
      const s = await getDoc(doc(db, 'stations', sid, 'shifts', crew));
      assigns[crew] = (s.exists() && (s.data() || {}).assign) || {};
    } catch (ignore) { assigns[crew] = {}; }
  }

  fit = {};
  myCrews.forEach(function (crew) {
    const rl = redlineState(people, held, redline, crew);
    const bs = boardState(board, assigns[crew], held);
    fit[crew] = { rl: rl, bs: bs, verdict: crewReady(rl, bs) };
  });
}

function qualName(id){ return qualNames[id] || id; }

function renderFitness(){
  const known = myCrews.some(c => fit[c] && fit[c].verdict.known);
  if (!known) { $('fitCard').style.display = 'none'; return; }

  $('fitCard').style.display = '';
  const box = $('fitBoxes');
  box.innerHTML = '';

  myCrews.forEach(function (crew) {
    const f = fit[crew];
    if (!f) return;
    const bad = !f.verdict.ready;
    const txt = summaryText(f.rl, f.bs, qualName);

    const d = document.createElement('div');
    d.className = 'p' + (bad ? ' bad' : '');
    d.innerHTML =
      '<div class="h"><span class="tag ' + crew + '">' +
        (CREW_HE[crew] || crew) + '</span>' +
        (bad ? 'לא כשירה' : 'כשירה') + '</div>' +
      '<div class="s' + (bad ? '' : ' ok') + '">' +
        (txt || 'הכל מאויש ומתאים') + '</div>';
    box.appendChild(d);
  });

  $('fitNote').textContent =
    (myCrews.length === 1
      ? 'מוצגת המשמרת שלך בלבד. '
      : '') +
    'מחושב לפי הנתונים של היום ומוצג על כל יום בלוח. ' +
    'שינוי בשיבוץ או בכשירויות משנה גם את הימים הבאים.';
}

// ---------- המשמרת הבאה ----------

function renderNext(){
  const box = $('nextBox');

  if (!rotations.length) {
    $('noRot').style.display = 'block';
    box.innerHTML = '<div class="txt">אין מחזור מוגדר.</div>';
    return;
  }
  if (!me.crew) {
    box.innerHTML = '<div class="txt">לא משויך למשמרת. פנה לרכז/ת משאבי אנוש.</div>';
    return;
  }

  const today = new Date();
  const d = nextShift(rotations, me.crew, today, overrides);
  if (!d) { box.innerHTML = '<div class="txt">לא נמצאה משמרת קרובה.</div>'; return; }

  const diff = daysBetween(today, d);
  const when = diff === 0 ? 'היום' : (diff === 1 ? 'מחר' : 'בעוד ' + diff + ' ימים');
  const t = shiftTimes(rotations[0], me.role, false);

  box.innerHTML =
    '<div class="big">' + d.getDate() + '.' + (d.getMonth() + 1) + '</div>' +
    '<div class="txt">המשמרת הבאה שלך — <b>' + when + '</b><br>' +
    'יום ' + DOWS[d.getDay()] + ' · ' + t.label + ' · ' + t.hours + ' שעות</div>';
}

// ---------- לוח החודש ----------

function render(){
  $('moLabel').textContent = MONTHS[viewMonth] + ' ' + viewYear;

  const dows = $('dows');
  dows.innerHTML = '';
  DOWS.forEach(function (d, i) {
    const el = document.createElement('div');
    // שישי ושבת בכתום, כדי שסוף השבוע ייקרא בלי לספור עמודות.
    el.className = 'dow' + (i >= 5 ? ' rest' : '');
    el.textContent = d;
    dows.appendChild(el);
  });

  const grid = $('grid');
  grid.innerHTML = '';

  const first = new Date(viewYear, viewMonth, 1);
  const last  = new Date(viewYear, viewMonth + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < first.getDay(); i++) {
    const pad = document.createElement('div');
    pad.className = 'day pad';
    grid.appendChild(pad);
  }

  for (let d = 1; d <= last; d++) {
    const date = new Date(viewYear, viewMonth, d);
    const crew = crewOnDate(rotations, date, overrides);
    const ov   = overrideOn(overrides, date);

    const f = crew ? fit[crew] : null;
    const unfit = !!(f && f.verdict.known && !f.verdict.ready);

    const eff  = swapEffect(mySwaps, auth.currentUser ? auth.currentUser.uid : '', toKey(date));
    const mineToday = me.crew &&
      personWorks(rotations, me.crew, date, overrides, mySwaps,
                  auth.currentUser ? auth.currentUser.uid : '');

    const el = document.createElement('div');
    el.className = 'day' + (crew ? ' ' + crew : '') +
                   (mineToday ? ' mine' : '') +
                   (unfit ? ' unfit' : '') +
                   (ov ? ' ovr' + (ov.kind === 'swap' ? ' swap' : '') : '') +
                   (sameDay(date, today) ? ' today' : '');
    if (eff) {
      el.title = (eff === 'in' ? 'אתה נכנס בהחלפה' : 'אתה לא עובד — החלפה מאושרת') + '\n';
    }
    if (ov) {
      el.title = (el.title || '') + overrideKindHe(ov.kind) +
                 (ov.note ? ' · ' + ov.note : '') +
                 (unfit ? '\n' : '');
    }
    if (unfit) {
      el.title = (el.title || '') + 'משמרת ' + (CREW_HE[crew] || crew) +
                 ' — לא כשירה · ' + summaryText(f.rl, f.bs, qualName);
    }
    // אבטחה ביום הזה. נקודה קטנה בפינה, וההסבר בתיאור —
    // הריבוע קטן מכדי לשאת טקסט, וכוכבית בלי הסבר היא חידה.
    const gToday = myGuards.filter(g => String(g.date || '') === toKey(date));
    if (gToday.length) {
      el.classList.add('guard');
      el.title = (el.title || '') +
        (el.title ? '\n' : '') +
        gToday.map(g => 'אבטחה · ' + (g.title || '') + ' · ' +
          (g.start || '') + '–' + (g.end || '') +
          (mineToday ? ' (בתוך המשמרת)' : ' (יום חופש)')).join('\n');
    }

    el.innerHTML = '<div class="n">' + d + '</div>' +
                   '<div class="c">' + (crew ? CREW_SHORT[crew] : '') + '</div>' +
                   (gToday.length ? '<div class="gd"></div>' : '');
    grid.appendChild(el);
  }

  if (me.crew && rotations.length) {
    const shifts = shiftsInMonth(rotations, me.crew, me.role,
                                 viewYear, viewMonth, overrides);
    $('sumShifts').textContent = shifts.length;
    $('sumHours').textContent  = hoursInMonth(rotations, me.crew, me.role,
                                              viewYear, viewMonth, overrides);
  } else {
    $('sumShifts').textContent = '—';
    $('sumHours').textContent  = '—';
  }
}

$('prev').onclick = () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  render();
};
$('next').onclick = () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  render();
};
</script>

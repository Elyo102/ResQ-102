<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef2f7">
  <title>ResQ · סידור עבודה</title>
  <link rel="stylesheet" href="./theme.css?v=42g1">
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;
      padding:20px;background:var(--bg,#eef2f7);color:var(--txt,#1c2532);
      font-family:"Segoe UI",Arial,sans-serif} main{width:min(100%,520px);background:var(--card,#fff);
      border:1px solid var(--line,#dfe5ec);border-radius:16px;padding:22px;text-align:center;
      box-shadow:0 5px 18px rgba(25,38,58,.06)} h1{font-size:22px;margin:0 0 10px}
    p{margin:0;color:var(--muted,#748091);line-height:1.65}.loader{display:inline-block;width:26px;height:26px;
      margin:14px;border:3px solid #c8d8e9;border-top-color:#347dbd;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main aria-live="polite">
    <h1>מעביר לסידור העבודה החדש</h1>
    <p id="status">בודק כניסה…</p>
    <span class="loader" aria-hidden="true"></span>
  </main>

  <script type="module">
    import { firebaseConfig } from './firebase-config.js?v=42g1';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    const status = document.getElementById('status');
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // המסך הישן הוא שער מעבר בלבד: אין בו Firestore, נתוני תחנה או
    // החלטות הרשאה. המנוע החדש בודק אותם בשרת ומציג את ברירת המחדל
    // התחנתית. כך URL/PWA ישנים אינם נתיב לעקוף פרסום והתראות.
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        status.textContent = 'נדרשת כניסה למערכת.';
        location.replace('./login.html?next=schedule-management.html');
        return;
      }
      status.textContent = 'מעביר לסידור התחנה…';
      location.replace('./schedule-management.html?tab=station');
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תחנה 102 — אישור בקשות</title>
<style>
  :root{
    --bg:#15171a; --card:#1e2126; --line:#2c3036; --txt:#e8eaed;
    --muted:#9aa0a6; --accent:#e8590c; --ok:#2e7d32; --err:#c62828;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Segoe UI",Arial,sans-serif;padding:18px}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:18px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;padding:10px;background:#111316;color:var(--txt);
        border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit}
  button{background:var(--accent);color:#fff;border:0;border-radius:6px;
        padding:10px 18px;font-size:14px;cursor:pointer;margin-top:14px;font-family:inherit}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  button.ok{background:var(--ok)}
  button.no{background:transparent;border:1px solid #6b3535;color:#ef9a9a}
  .req{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;
       background:#191c20}
  .req .nm{font-size:16px;font-weight:600;margin-bottom:8px}
  .req .ln{font-size:13px;color:var(--muted);line-height:1.9}
  .req .ln b{color:var(--txt);font-weight:500}
  .match{margin-top:10px;padding:9px;border-radius:6px;font-size:13px;line-height:1.6}
  .match.found{background:#1d3a20;color:#a5d6a7}
  .match.none{background:#3a1d1d;color:#ef9a9a}
  .acts{display:flex;gap:10px}
  .acts button{flex:1}
  .hide{display:none}
  .who{font-size:13px;color:var(--muted)}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 0}
  .msg{margin-top:14px;padding:11px;border-radius:6px;font-size:13px;display:none}
  .msg.err{display:block;background:#3a1d1d;color:#ef9a9a}
  .msg.ok{display:block;background:#1d3a20;color:#a5d6a7}
  h2{font-size:16px;margin:0 0 12px;color:var(--accent)}
  select{width:100%;padding:10px;background:#111316;color:var(--txt);
        border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit}
  .two{display:flex;gap:12px}
  .two>div{flex:1}
  .rotstate{font-size:13px;color:var(--muted);background:#191c20;border:1px solid var(--line);
        border-radius:6px;padding:11px;line-height:1.8;margin-bottom:6px}
  .rotstate b{color:var(--txt)}
</style>
</head>
<body>
<div class="wrap">

  <h1>אישור בקשות הרשמה</h1>
  <div class="sub">תחנת כיבוי אילת</div>

  <!-- כניסה -->
  <div class="card" id="authCard">
    <label>מייל</label>
    <input type="email" id="email" autocomplete="username">
    <label>סיסמה</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button id="btnIn">כניסה</button>
    <div class="msg" id="authMsg"></div>
  </div>

  <!-- אין הרשאה -->
  <div class="card hide" id="denyCard">
    <div style="text-align:center;line-height:1.9">
      <div style="font-size:34px">🔒</div>
      <div style="font-size:17px;font-weight:600">אין לך הרשאה לדף הזה</div>
      <div style="font-size:13px;color:var(--muted)">
        הדף מיועד לרכז/ת משאבי אנוש ולקצינים בלבד.
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px" id="denyWho"></div>
    </div>
    <button id="btnOutDeny" class="ghost" style="width:100%">התנתק</button>
  </div>

  <!-- אזור עבודה -->
  <div id="work" class="hide">
    <div class="card">
      <div class="who" id="who"></div>
      <button id="btnOut" class="ghost">התנתק</button>
    </div>
    <div class="card">
      <h2>בקשות הרשמה</h2>
      <div id="list"><div class="empty">טוען...</div></div>
      <button id="btnRefresh" class="ghost">רענן רשימה</button>
    </div>

    <div class="card">
      <h2>מחזור הסידור</h2>
      <div id="rotState" class="rotstate">טוען...</div>

      <label>תאריך עוגן — יום שאתה יודע בוודאות מי עבד בו</label>
      <input type="date" id="anchorDate">

      <label>איזו משמרת עבדה בתאריך הזה</label>
      <select id="anchorCrew">
        <option value="A">משמרת א'</option>
        <option value="B">משמרת ב'</option>
        <option value="C">משמרת ג'</option>
      </select>

      <div class="two">
        <div>
          <label>תחילת משמרת</label>
          <input type="time" id="shiftStart" value="07:00">
        </div>
        <div>
          <label>סיום משמרת</label>
          <input type="time" id="shiftEnd" value="07:00">
        </div>
      </div>

      <div class="two">
        <div>
          <label>תחילת משמרת - ראש משמרת</label>
          <input type="time" id="cmdStart" value="06:45">
        </div>
        <div>
          <label>סיום משמרת - יטבתה</label>
          <input type="time" id="specEnd" value="08:00">
        </div>
      </div>

      <button id="btnRot">שמור מחזור</button>
      <div class="msg" id="rotMsg"></div>
    </div>
  </div>

</div>

<script type="module">
import { firebaseConfig, STATION_ID } from './firebase-config.js';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection,
         getDocs, query, where, serverTimestamp, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { CREWS, CREW_HE, crewOnDate, toKey } from './rotation.js';

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const SUPER_ADMIN = 'fire102.shits@gmail.com';
const $ = id => document.getElementById(id);

const ROLE_HE = {
  firefighter: 'לוחם אש',
  commander: 'קצין / מפקד משמרת',
  hr_coordinator: 'רכז/ת משאבי אנוש'
};

function msg(el, text, kind){
  const m = $(el);
  m.textContent = text;
  m.className = 'msg ' + (kind || '');
}

// ---------- כניסה ----------

$('btnIn').onclick = async () => {
  const btn = $('btnIn');
  btn.disabled = true;
  try {
    await signInWithEmailAndPassword(auth, $('email').value.trim().toLowerCase(), $('pass').value);
  } catch (e) {
    msg('authMsg', 'מייל או סיסמה שגויים.', 'err');
  }
  btn.disabled = false;
};

$('btnOut').onclick = () => signOut(auth);
$('btnOutDeny').onclick = () => signOut(auth);
$('btnRefresh').onclick = () => loadRequests();

onAuthStateChanged(auth, async user => {
  if (!user) {
    $('authCard').classList.remove('hide');
    $('work').classList.add('hide');
    $('denyCard').classList.add('hide');
    return;
  }

  const isSuper = String(user.email || '').toLowerCase() === SUPER_ADMIN;
  let roleOk = isSuper, label = 'מנהל מערכת';

  if (!isSuper) {
    try {
      const s = await getDoc(doc(db, 'stations', STATION_ID, 'users', user.uid));
      if (s.exists() && (s.data().role === 'hr_coordinator' || s.data().role === 'commander')) {
        roleOk = true;
        label = s.data().full_name + ' — ' + (ROLE_HE[s.data().role] || '');
      }
    } catch (ignore) {}
  }

  if (!roleOk) {
    // חשוב: לא מנתקים אוטומטית. ניתוק כאן היה מפיל גם לשוניות
    // אחרות של המערכת, כי Firebase משתף התחברות בין לשוניות.
    $('authCard').classList.add('hide');
    $('work').classList.add('hide');
    $('denyCard').classList.remove('hide');
    $('denyWho').textContent = 'מחובר כ־' + user.email;
    return;
  }

  $('denyCard').classList.add('hide');

  $('who').textContent = 'מחובר: ' + label;
  $('authCard').classList.add('hide');
  $('work').classList.remove('hide');
  loadRequests();
  loadRotation();
});

// ---------- טעינת בקשות ----------

async function loadRequests(){
  const list = $('list');
  list.innerHTML = '<div class="empty">טוען...</div>';

  let snaps;
  try {
    const q = query(collection(db, 'stations', STATION_ID, 'registration_requests'),
                    where('status', '==', 'pending'));
    snaps = await getDocs(q);
  } catch (e) {
    list.innerHTML = '<div class="empty">שגיאה בטעינה: ' + (e.code || e.message) + '</div>';
    return;
  }

  if (snaps.empty) {
    list.innerHTML = '<div class="empty">אין בקשות ממתינות.</div>';
    return;
  }

  list.innerHTML = '';
  for (const d of snaps.docs) {
    const r = d.data();
    const box = document.createElement('div');
    box.className = 'req';

    // שליפת הרשומה מרשימת התחנה לפי הקוד שהוזן
    let roster = null;
    try {
      const rs = await getDoc(doc(db, 'stations', STATION_ID, 'pending_users', r.claimed_code));
      if (rs.exists()) roster = rs.data();
    } catch (ignore) {}

    const matchHtml = roster
      ? '<div class="match found">נמצא ברשימת התחנה: <b>' + esc(roster.full_name) + '</b>' +
        ' · ' + (ROLE_HE[roster.role] || roster.role) +
        (roster.crew ? ' · ' + CREW_HE[roster.crew] : '') + '</div>'
      : '<div class="match none">הקוד לא נמצא ברשימת התחנה. אשר רק אם אתה מזהה את האדם.</div>';

    box.innerHTML =
      '<div class="nm">' + esc(r.full_name) + '</div>' +
      '<div class="ln">קוד אישי: <b>' + esc(r.claimed_code) + '</b></div>' +
      '<div class="ln">מייל: <b>' + esc(r.email) + '</b></div>' +
      (r.phone ? '<div class="ln">טלפון: <b>' + esc(r.phone) + '</b></div>' : '') +
      matchHtml +
      '<div class="acts">' +
        '<button class="ok" data-act="ok">אשר</button>' +
        '<button class="no" data-act="no">דחה</button>' +
      '</div>';

    box.querySelector('[data-act="ok"]').onclick = () => approve(d.id, r, roster, box);
    box.querySelector('[data-act="no"]').onclick = () => reject(d.id, box);
    list.appendChild(box);
  }
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---------- אישור ----------

async function approve(uid, r, roster, box){
  box.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    await setDoc(doc(db, 'stations', STATION_ID, 'users', uid), {
      personal_code: r.claimed_code,
      full_name:     roster ? roster.full_name : r.full_name,
      email:         r.email,
      phone:         r.phone || (roster ? roster.phone : '') || '',
      crew:          roster ? (roster.crew || '') : '',
      role:          roster ? roster.role : 'firefighter',
      position:      roster ? (roster.position || '') : '',
      is_active:     true,
      last_login:    null,
      created_at:    serverTimestamp()
    });

    if (roster) {
      try {
        await deleteDoc(doc(db, 'stations', STATION_ID, 'pending_users', r.claimed_code));
      } catch (ignore) {}
    }

    await deleteDoc(doc(db, 'stations', STATION_ID, 'registration_requests', uid));
    box.remove();
    if (!$('list').querySelector('.req')) {
      $('list').innerHTML = '<div class="empty">אין בקשות ממתינות.</div>';
    }
  } catch (e) {
    alert('שגיאה באישור: ' + (e.code || e.message));
    box.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

// ---------- דחייה ----------

async function reject(uid, box){
  if (!confirm('לדחות את הבקשה?')) return;
  box.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    await deleteDoc(doc(db, 'stations', STATION_ID, 'registration_requests', uid));
    box.remove();
    if (!$('list').querySelector('.req')) {
      $('list').innerHTML = '<div class="empty">אין בקשות ממתינות.</div>';
    }
  } catch (e) {
    alert('שגיאה בדחייה: ' + (e.code || e.message));
    box.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

// =====================================================================
//  מחזור הסידור
// =====================================================================

async function loadRotation(){
  const box = $('rotState');
  let snaps;
  try {
    snaps = await getDocs(collection(db, 'stations', STATION_ID, 'rotations'));
  } catch (e) {
    box.textContent = 'שגיאה בטעינה: ' + (e.code || e.message);
    return;
  }

  if (snaps.empty) {
    box.innerHTML = 'עדיין לא הוגדר מחזור. מלא את השדות למטה ושמור.';
    const t = new Date();
    $('anchorDate').value = toKey(t);
    return;
  }

  const rots = snaps.docs.map(d => d.data());
  const base = rots[0];
  const today = new Date();
  const tomorrow = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);

  const cToday = crewOnDate(rots, today);
  const cTomor = crewOnDate(rots, tomorrow);

  box.innerHTML =
    'מחזור פעיל · ' + rots.length + ' משמרות · עוגן ' + base.anchor_date + '<br>' +
    'היום: <b>' + (CREW_HE[cToday] || '—') + '</b> · ' +
    'מחר: <b>' + (CREW_HE[cTomor] || '—') + '</b><br>' +
    'משמרת ' + (base.shift_start || '') + '–' + (base.shift_end || '') +
    ' · ראש משמרת מ-' + (base.commander_start || '') +
    ' · יטבתה עד ' + (base.special_end || '');

  $('anchorDate').value = base.anchor_date || '';
  $('anchorCrew').value = crewOnDate(rots, base.anchor_date ? new Date(base.anchor_date + 'T00:00:00') : today) || 'A';
  $('shiftStart').value = base.shift_start || '07:00';
  $('shiftEnd').value   = base.shift_end || '07:00';
  $('cmdStart').value   = base.commander_start || '06:45';
  $('specEnd').value    = base.special_end || '08:00';
}

// חישוב מספר שעות בין שתי שעות ביממה של 24 שעות
function hoursSpan(start, end){
  const s = start.split(':'), e = end.split(':');
  const sm = Number(s[0]) * 60 + Number(s[1]);
  const em = Number(e[0]) * 60 + Number(e[1]);
  let diff = em - sm;
  if (diff <= 0) diff += 1440;   // חוצה חצות
  return Math.round((1440 - 0 + diff - 1440) / 60 * 100) / 100 || 24;
}

// אורך משמרת מלאה: מהתחלה עד הסיום ביום שלמחרת
function fullShiftHours(start, end){
  const s = start.split(':'), e = end.split(':');
  const sm = Number(s[0]) * 60 + Number(s[1]);
  const em = Number(e[0]) * 60 + Number(e[1]);
  let mins = (1440 - sm) + em;
  return Math.round(mins / 60 * 100) / 100;
}

$('btnRot').onclick = async () => {
  const btn = $('btnRot');
  const anchor = $('anchorDate').value;
  const crew   = $('anchorCrew').value;
  const sStart = $('shiftStart').value;
  const sEnd   = $('shiftEnd').value;
  const cStart = $('cmdStart').value;
  const spEnd  = $('specEnd').value;

  if (!anchor || !sStart || !sEnd) {
    msg('rotMsg', 'נא למלא תאריך עוגן ושעות משמרת.', 'err');
    return;
  }

  btn.disabled = true;
  msg('rotMsg', '', '');

  // המשמרת שנבחרה מקבלת מיקום 0, והשאר אחריה לפי הסדר א-ב-ג
  const startIdx = CREWS.indexOf(crew);

  const shiftHours = fullShiftHours(sStart, sEnd);
  const cmdHours   = fullShiftHours(cStart, sEnd);
  const specHours  = fullShiftHours(sStart, spEnd);

  try {
    const batch = writeBatch(db);
    for (let i = 0; i < CREWS.length; i++) {
      const c = CREWS[(startIdx + i) % CREWS.length];
      batch.set(doc(db, 'stations', STATION_ID, 'rotations', c), {
        crew: c,
        position_in_cycle: i,
        cycle_days: CREWS.length,
        anchor_date: anchor,
        shift_start: sStart,
        shift_end: sEnd,
        shift_hours: shiftHours,
        commander_start: cStart,
        commander_shift_hours: cmdHours,
        special_end: spEnd,
        special_shift_hours: specHours,
        is_active: true,
        updated_at: serverTimestamp()
      });
    }
    await batch.commit();
    msg('rotMsg', 'המחזור נשמר. לוחם ' + shiftHours + ' שעות · ראש משמרת ' +
        cmdHours + ' · יטבתה ' + specHours + '.', 'ok');
    loadRotation();
  } catch (e) {
    msg('rotMsg', 'שגיאה בשמירה: ' + (e.code || e.message), 'err');
  }
  btn.disabled = false;
};
</script>
</body>
</html>

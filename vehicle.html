<style>
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--txt); direction:rtl;
        font-family:"Segoe UI",Arial,sans-serif; padding:18px }
  .wrap{ max-width:900px; margin:0 auto }
  h1{ font-size:21px; margin:0 0 3px }
  h2{ font-size:15px; margin:0 0 4px; color:var(--accent-txt) }
  .sub{ color:var(--muted); font-size:12.5px; margin-bottom:18px }
  .note{ color:var(--muted); font-size:12.5px; line-height:1.7 }

  .card{ background:var(--card); border:1px solid var(--line);
         border-radius:12px; padding:16px; margin-bottom:14px }

  label{ display:block; font-size:12.5px; color:var(--muted); margin:12px 0 4px }
  select, textarea, input{ width:100%; padding:10px; background:var(--input);
        color:var(--txt); border:1px solid var(--line); border-radius:7px;
        font-size:15px; font-family:inherit; min-height:44px; box-sizing:border-box }
  textarea{ min-height:74px; resize:vertical }
  input[type=file]{ padding:8px; font-size:13px }

  .btn{ border:1px solid var(--line); background:transparent; color:var(--muted);
        border-radius:7px; padding:10px 17px; font-size:14px; cursor:pointer;
        font-family:inherit; font-weight:600; margin-top:12px; width:auto; min-height:44px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center }
  .btn:hover{ color:var(--txt); border-color:var(--line-hover) }
  .btn.go{ background:var(--accent); border-color:var(--accent); color:var(--accent-on) }
  .btn.ok{ background:var(--go); border-color:var(--go); color:var(--on-accent) }
  .btn.sm{ padding:6px 12px; font-size:12.5px; margin-top:0; min-height:44px }
  .btn:disabled{ opacity:.5; cursor:not-allowed }

  /* ---------- בוררים ---------- */
  .chips{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px }
  .chips button{ width:auto; margin:0; background:var(--chip);
                 border:1px solid var(--line); color:var(--muted);
                 border-radius:9px; padding:9px 15px; font-family:inherit;
                 font-size:14px; font-weight:600; cursor:pointer;
                 display:inline-flex; align-items:center; gap:8px; min-height:44px; box-sizing:border-box }
  .chips button.on{ background:var(--accent); border-color:var(--accent);
                    color:var(--accent-on) }
  .chips button i{ width:8px; height:8px; border-radius:50%; flex:none }
  .chips button .n{ font-weight:800; font-variant-numeric:tabular-nums }

  /* ---------- התמונה והנקודות ---------- */
  .stage{ position:relative; border:1px solid var(--line); border-radius:12px;
          overflow:hidden; background:var(--panel); touch-action:pan-y pinch-zoom }
  .stage img.base{ display:block; width:100%; height:auto }
  .stage.pick{ cursor:crosshair }

  .pin{ position:absolute; transform:translate(-50%,-50%);
        width:44px; height:44px; border-radius:50%; cursor:pointer;
        display:flex; align-items:center; justify-content:center;
        font-size:0; color:#fff; background:transparent; border:0; padding:0 }
  .pin::after{ content:''; width:14px; height:14px; border-radius:50%;
        background:var(--pin-color); border:2px solid #fff;
        box-shadow:0 1px 5px rgba(0,0,0,.6) }
  .pin:focus-visible{ outline:3px solid var(--accent); outline-offset:2px }
  .pin.done{ opacity:.5 }

  .empty{ padding:30px 18px; text-align:center }
  .empty .big{ font-size:15px; font-weight:700; margin-bottom:6px }

  .legend{ display:flex; gap:12px; flex-wrap:wrap; align-items:center;
           margin-top:10px; font-size:12px; color:var(--muted) }
  .legend span.k{ display:inline-flex; align-items:center; gap:5px }
  .legend i{ width:9px; height:9px; border-radius:50%; display:inline-block }

  /* ---------- תקלה ---------- */
  .f{ border:1px solid var(--line); border-radius:11px; padding:13px;
      margin-top:11px; background:var(--panel); border-inline-start-width:4px }
  .f .top{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap }
  .f .num{ width:24px; height:24px; border-radius:50%; flex:none; color:#fff;
           display:inline-flex; align-items:center; justify-content:center;
           font-size:12px; font-weight:800 }
  .f .ttl{ font-size:15.5px; font-weight:700; flex:1 1 150px }
  .f .desc{ font-size:14px; line-height:1.7; margin-top:6px;
            white-space:pre-wrap; word-break:break-word }
  .f .rep{ font-size:12px; color:var(--muted); margin-top:8px;
           padding-top:8px; border-top:1px solid var(--line-soft) }
  .f .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:11px;
            align-items:center }
  .f.done{ opacity:.62 }
  .tag{ font-size:11px; font-weight:700; border-radius:20px;
        padding:2px 10px; white-space:nowrap; border:1px solid var(--line);
        color:var(--muted) }

  .shots{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px }
  .shots img{ width:92px; height:92px; object-fit:cover; border-radius:8px;
              border:1px solid var(--line); cursor:pointer; display:block }
  .shots .ld{ font-size:12px; color:var(--muted) }

  .msg{ margin-top:12px; padding:11px; border-radius:6px; font-size:13px;
        line-height:1.6; display:none }
  .msg.err{ display:block; background:var(--err-bg); color:var(--err-fg) }
  .msg.ok{ display:block; background:var(--ok-bg); color:var(--ok-fg) }
  .msg.info{ display:block; background:var(--chip); color:var(--dim) }
  .hide{ display:none !important }

  #ov{ position:fixed; inset:0; background:rgba(8,10,13,.75); z-index:1000;
       display:none; align-items:flex-start; justify-content:center;
       padding:4vh 14px; overflow:auto }
  #ov.on{ display:flex }
  .dlg{ background:var(--card); border:1px solid var(--line); border-radius:14px;
        width:100%; max-width:480px; padding:18px; position:relative }
  .dlg h3{ margin:0 0 3px; font-size:17px }
  .dlg .hint{ color:var(--muted); font-size:12.5px; margin-bottom:6px;
              line-height:1.7 }
  .dlg .x{ position:absolute; top:10px; inset-inline-end:14px; color:var(--muted);
           font-size:26px; cursor:pointer; line-height:1 }
  .dlg .x:hover{ color:var(--txt) }
  .row{ display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-top:12px }

  #lb{ position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:1200;
       display:none; align-items:center; justify-content:center; padding:20px }
  #lb.on{ display:flex }
  #lb img{ max-width:100%; max-height:90vh; border-radius:9px }
  #lb .x{ position:absolute; top:14px; inset-inline-end:18px; color:#fff;
          font-size:30px; cursor:pointer; line-height:1 }
</style>
</head>
<body data-resq-shell="v1" data-resq-page="vehicle">
<div id="errBar" role="alert" aria-live="assertive"></div>
<div class="wrap">
  <div class="card hide" id="loadError" role="alert">
    <p>לא ניתן לטעון את נתוני הרכב והתקלות. אין להסתמך על תצוגה חלקית.</p>
    <button class="btn" id="retryLoad" type="button">נסה שוב</button>
  </div>

  <div id="denyCard" class="card hide">
    <h2>אין הרשאה</h2>
    <div class="note" id="denyWho"></div>
    <div class="note">אין לחשבון הזה שיוך לתחנה.</div>
    <button class="btn" id="btnOutDeny">התנתק</button>
  </div>

  <div id="work" class="hide">
    <h1>מפת רכב</h1>
    <div class="sub" id="topNote">בוחרים צד, לוחצים על הנקודה, מדווחים.</div>

    <div class="card">
      <h2>רכב</h2>
      <div class="chips" id="vehChips"></div>
      <div class="note" id="vehState">—</div>
      <div class="row" id="importRow"></div>
      <div class="msg" id="impMsg"></div>
    </div>

    <div class="card">
      <div class="chips" id="sideChips"></div>

      <div id="stageWrap"></div>
      <div class="row" id="viewNav" aria-label="מעבר בין תמונות הרכב" hidden>
        <button type="button" class="btn" id="viewPrev">→ הצד הקודם</button>
        <button type="button" class="btn" id="viewNext">הצד הבא ←</button>
        <span class="note" id="viewHint" aria-live="polite">גררו לצדדים או בחרו צד. זו תצוגת תמונות, לא תלת־ממד.</span>
      </div>

      <div class="legend" id="legend"></div>
      <div class="row" id="photoActs"></div>
      <input type="file" id="basePick" accept="image/*" capture="environment"
             class="hide">
      <input type="file" id="baseGallery" accept="image/*" class="hide">
      <div class="msg" id="baseMsg"></div>
    </div>

    <div class="card">
      <h2>דיווחים על הרכב</h2>
      <div class="note" id="listNote">—</div>
      <div id="list"></div>
    </div>
  </div>
</div>

<div id="ov"><div class="dlg">
  <span class="x" id="dlgX">×</span>
  <h3 id="dlgTitle">דיווח חדש</h3>
  <div class="hint" id="dlgHint"></div>
  <div id="dlgBody"></div>
</div></div>

<div id="lb"><span class="x" id="lbX">×</span><img id="lbImg" alt="צילום"></div>

<script type="module">
import { firebaseConfig, STATION_ID } from './firebase-config.js?v=42h49';
import { renderNav, renderStuckNav } from './nav.js?v=42h49';
import { MEMBER_ROLES } from './roles.js?v=42h49';
import { initPWA } from './pwa.js?v=42h49';
import { watchCallouts } from './callout.js?v=42h49';
import { SIDES, sideHe, viewId, pointAt, pointsOn, countBySide,
         viewsOf, missingHe, coverage, nextToShoot, hasPoint, adjacentPhotoSide }
  from './vmap.js?v=42h49';
import { FAULT_KINDS, kindHe, SEVERITIES, sevHe, sevColor, sevBgColor, UNSET,
         needsGrading, isOpen, isDamage, DAMAGE_DELETE_WHY, mergeFleet,
         vehicleState, sortFaults, dmy, reportedLine, shrinkImage, createPhotoQueue }
  from './faults.js?v=42h49';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc,
         deleteDoc, serverTimestamp, query, orderBy, documentId, limit, startAfter }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;');

const STAFF = ['deputy','commander','station_commander','hr_coordinator'];

const app  = initializeApp(firebaseConfig);
// App Check. כל עוד המפתח ב-appcheck.js ריק — אינו עושה דבר.
import { initAppCheck } from './appcheck.js?v=42h49';
await initAppCheck(app);
const auth = getAuth(app);
const db   = getFirestore(app);
const createFaultReport = httpsCallable(getFunctions(app, 'europe-west1'), 'createFaultReport',
  { timeout:60000 });
const appendFaultPhotos = httpsCallable(getFunctions(app, 'europe-west1'), 'appendFaultPhotos',
  { timeout:60000 });

let SID = '', ME = { uid:'', name:'', crew:'' }, CAN_MANAGE = false;
let faults = [], views = [], fleet = [], shots = {}, shotsInflight = {}, shotsPages = {};
let AUTH_GEN = 0;
let LOAD_GEN = 0, DETAIL_GEN = 0;
const shotObjectUrls = [];

function bumpIdentity(){
  NEW_FAULT_MODAL_GEN += 1;
  NEW_FAULT_UPLOAD_LOCKED = false;
  AUTH_GEN += 1;
  LOAD_GEN += 1;
  DETAIL_GEN += 1;
  SID = ''; ME = { uid:'', name:'', crew:'' }; CAN_MANAGE = false;
  faults = []; views = []; fleet = [];
  shots = {}; shotsInflight = {}; shotsPages = {};
  $('work').classList.add('hide');
  $('loadError').classList.add('hide');
  $('ov').classList.remove('on');
  $('dlgBody').replaceChildren();
  $('lb').classList.remove('on');
  while (shotObjectUrls.length) {
    try { URL.revokeObjectURL(shotObjectUrls.pop()); } catch (ignore) {}
  }
  return AUTH_GEN;
}
let vid = '', side = 'right', vehicleRequested = false;
const photoTargets = new Map();

initPWA({ offer:false });

window.addEventListener('error', function (e) {
  const b = $('errBar');
  b.innerHTML = '<span class="xx" onclick="this.parentNode.style.display=\'none\'">×</span>' +
    '<b>שגיאה במסך</b><code>' + esc(e.message || '') + '</code>';
  b.style.display = 'block';
});

function msg(t, cls, id){
  const m = $(id || 'baseMsg');
  m.textContent = t; m.className = 'msg ' + (cls || 'info');
}

function actionError(error){
  close();
  const bar = $('errBar');
  bar.textContent = 'אירעה שגיאה. יש לבדוק את מצב הנתונים לפני ניסיון נוסף. ' +
    String(error && (error.message || error.code) || '');
  bar.style.display = 'block';
  bar.scrollIntoView({ block:'start' });
}

// ---------- הרשאה ----------

onAuthStateChanged(auth, async user => {
  // F-01: clear photo cache / inflight on every auth edge (logout, station,
  // user switch) so a late getDocs cannot paint foreign photos.
  const gen = bumpIdentity();
  if (!user) { location.replace('./login.html?next=vehicle.html'); return; }

  let c = {};
  try { c = (await user.getIdTokenResult()).claims || {}; } catch (ignore) {}
  if (gen !== AUTH_GEN) return;

  const isSuper = c.super === true;
  const isMember = isSuper ||
    MEMBER_ROLES.indexOf(c.role) !== -1;

  SID = c.stationId || (isSuper ? STATION_ID : '');
  ME = { uid: user.uid, name: c.full_name || user.email || '', crew: c.shift || '' };
  CAN_MANAGE = isSuper || STAFF.indexOf(c.role) !== -1;

  if (!isMember || !SID) {
    $('denyCard').classList.remove('hide');
    $('denyWho').textContent = 'מחובר כ־' + (user.email || '');
    renderStuckNav(user.email || '');
    return;
  }

  renderNav(c, 'vehicle.html', user.email || '');
  watchCallouts(db, SID, user.uid, { name: user.email || '' });

  // רכב מהכתובת, כדי שקישור ממסך התקלות יפתח את הרכב הנכון.
  const q = new URLSearchParams(location.search);
  vehicleRequested = q.has('v');
  vid = q.get('v') || '';
  const s = q.get('side') || '';
  if (SIDES.some(x => x.id === s)) side = s;

  await loadAll();
});

$('btnOutDeny').onclick = () => signOut(auth);

// ---------- טעינה ----------

async function loadAll(){
  const reqSid = SID, reqGen = AUTH_GEN, reqLoad = ++LOAD_GEN;
  if (!reqSid) return;
  const nextFaults = [], nextViews = [];
  let boardVehicles = [], anchors = [];
  $('retryLoad').disabled = true;
  let fs_, bd, vs, vw;
  try {
    [fs_, bd, vs, vw] = await Promise.all([
      getDocs(collection(db, 'stations', reqSid, 'faults')),
      getDoc(doc(db, 'stations', reqSid, 'config', 'board')),
      getDocs(collection(db, 'stations', reqSid, 'vehicles')),
      getDocs(collection(db, 'stations', reqSid, 'vehicle_views'))
    ]);
  } catch (error) {
    if (reqSid !== SID || reqGen !== AUTH_GEN || reqLoad !== LOAD_GEN) return false;
    close();
    $('lb').classList.remove('on');
    $('work').classList.add('hide');
    $('loadError').classList.remove('hide');
    $('retryLoad').disabled = false;
    return false;
  }
  if (reqSid !== SID || reqGen !== AUTH_GEN || reqLoad !== LOAD_GEN) return;

  fs_.forEach(d => nextFaults.push(Object.assign({ id:d.id }, d.data() || {})));
  if (bd && bd.exists()) boardVehicles = (bd.data() || {}).vehicles || [];
  vs.forEach(d => {
    const v = d.data() || {};
    if (v.kind && v.kind !== 'anchor') return;
    anchors.push(Object.assign({ id:d.id }, v));
  });
  vw.forEach(d => nextViews.push(Object.assign({ id:d.id }, d.data() || {})));

  faults = nextFaults; views = nextViews;
  fleet = mergeFleet(boardVehicles, anchors, { includeInactive:true });
  // A deep link is an identity, not a suggestion. Never replace an explicit
  // archived/missing vehicle with a different one that happens to be first.
  if (!vid && !vehicleRequested) vid = (fleet.find(v => v.active !== false) || {}).id || '';

  render();
  $('loadError').classList.add('hide');
  $('retryLoad').disabled = false;
  $('work').classList.remove('hide');
  return true;
}

$('retryLoad').onclick = () => { void loadAll(); };

// ---------- ציור ----------

function canAddToVehicle(id = vid){
  return !!id && fleet.some(v => v.id === id && v.active !== false);
}

function captureVehicleTarget(){
  return { id:vid, side, sid:SID, uid:ME.uid, name:ME.name, crew:ME.crew };
}

function requireVehicleTarget(target){
  if (!target || target.id !== vid || target.side !== side || target.sid !== SID ||
      target.uid !== auth.currentUser?.uid || !canAddToVehicle(target.id)) {
    throw new Error('בחירת הרכב השתנתה או שהרכב אינו פעיל. יש לפתוח את הפעולה מחדש.');
  }
}

function knownFaultVehicle(f){
  return !!f && f.vehicle_id === vid && fleet.some(v => v.id === f.vehicle_id);
}

function captureFaultTarget(f){
  return { id:f.id, vehicle:f.vehicle_id, sid:SID, uid:ME.uid, name:ME.name };
}

function requireFaultTarget(target){
  if (!target || !target.id || target.sid !== SID || target.uid !== auth.currentUser?.uid ||
      !knownFaultVehicle({vehicle_id:target.vehicle})) {
    throw new Error('הרכב או המשתמש השתנו. יש לפתוח את התקלה מחדש.');
  }
}

function render(){
  renderVehicles();
  renderImport();
  renderSides();
  renderStage();
  renderList();
}

function renderVehicles(){
  const box = $('vehChips');
  box.innerHTML = '';
  if (!fleet.length) {
    box.innerHTML = '<div class="note">לא הוגדרו רכבים. רכבי כיבוי בלוח ' +
                    'הציוות, רכבי עיגון במסך התקלות.</div>';
    $('vehState').textContent = '';
    return;
  }
  fleet.forEach(function (v) {
    const st = vehicleState(faults, v.id);
    const b = document.createElement('button');
    b.type = 'button';
    if (v.id === vid) b.className = 'on';
    b.innerHTML = '<i style="background:' + st.color + '"></i>' +
                  esc(v.name) + (v.role ? ' <span class="n">·</span> ' +
                  esc(v.role) : '') + (v.active === false ? ' · הוצא מהצי' : '');
    b.onclick = function () { vid = v.id; render(); };
    box.appendChild(b);
  });

  const v = fleet.filter(x => x.id === vid)[0];
  if (!v) { $('vehState').textContent = vehicleRequested ? 'הרכב שבקישור לא נמצא. לא נבחר רכב אחר.' : ''; return; }
  const st = vehicleState(faults, v.id);
  const cov = coverage(views, v.id);
  const miss = missingHe(views, v.id);
  $('vehState').innerHTML =
    (v.active === false ? '<b>הרכב הוצא מהצי — מוצגת ההיסטוריה שלו.</b><br>' : '') +
    '<b style="color:' + st.color + '">' + esc(st.he) + '</b> · ' +
    'סט תמונות ' + cov.done + ' מתוך ' + cov.total +
    (miss ? ' · ' + esc(miss) : '');
}

// ---------- ייבוא סט מצורף ----------
//
// ארבע התמונות של 41 ארוזות בקובץ נפרד, כי אין לי דרך לכתוב
// ל-Firestore — רק הדפדפן של אלדד, מחובר כמשתמש, יכול.
//
// **import דינמי ולא רגיל.** הקובץ שוקל יותר ממגה, והוא נחוץ
// פעם אחת בחיי המערכת. ייבוא רגיל היה מוסיף את המשקל הזה לכל
// פתיחה של המסך, לכולם, לנצח.
const BUNDLE = { label: 'רכב 41 · פיקוד ושליטה', src: './v41.js?v=42h49' };

function renderImport(){
  const box = $('importRow');
  box.innerHTML = '';
  if (!CAN_MANAGE || !canAddToVehicle()) return;
  const target = captureVehicleTarget();

  // מוצג רק כשלרכב הנבחר אין אף תמונה. אחרי הייבוא הכפתור
  // נעלם מעצמו, ואי אפשר לדרוס בטעות סט קיים.
  if (Object.keys(viewsOf(views, vid)).length > 0) return;

  const v = fleet.filter(x => x.id === vid)[0];
  const b = document.createElement('button');
  b.className = 'btn go';
  b.textContent = 'ייבא את סט התמונות המצורף (' + BUNDLE.label + ')';
  b.onclick = async function (){
    if (!window.confirm('הסט המצורף הוא של ' + BUNDLE.label + '.\n\n' +
        'הוא ייכנס לרכב "' + ((v && v.name) || vid) + '".\n\n' +
        'אם זה לא אותו רכב — בטל, ובחר את הרכב הנכון.\n\nלייבא?')) return;
    b.disabled = true;
    msg('טוען את הסט…', 'info', 'impMsg');
    try {
      requireVehicleTarget(target);
      const mod = await import(BUNDLE.src);
      let n = 0;
      const bundledSides = SIDES.filter(sd => mod.SET[sd.id]);
      for (const sd of bundledSides) {
        const data = mod.SET[sd.id];
        if (!data) continue;
        requireVehicleTarget(target);
        await setDoc(doc(db, 'stations', target.sid, 'vehicle_views', viewId(target.id, sd.id)), {
          vehicle_id: target.id, side: sd.id, photo: data, w: 1400, h: 1050,
          by_uid: target.uid, by_name: target.name,
          created_key: new Date().toISOString(), created_at: serverTimestamp()
        });
        n++;
        msg(n + ' מתוך ' + bundledSides.length + ' הועלו…', 'info', 'impMsg');
      }
      msg(n + ' תמונות נשמרו.', 'ok', 'impMsg');
      await loadAll();
    } catch (e) {
      b.disabled = false;
      msg('הייבוא נכשל. (' + (e.code || e.message || '') + ')', 'err', 'impMsg');
    }
  };
  box.appendChild(b);
}

function renderSides(){
  const box = $('sideChips');
  box.innerHTML = '';
  const n = countBySide(faults, vid);
  SIDES.forEach(function (s) {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(s.id === side));
    b.dataset.side = s.id;
    if (s.id === side) b.className = 'on';
    b.innerHTML = esc(s.he) +
      (n[s.id] ? ' <span class="n" style="color:' +
        (s.id === side ? 'inherit' : 'var(--bad-txt)') + '">' + n[s.id] + '</span>' : '');
    b.onclick = function () { side = s.id; render(); };
    box.appendChild(b);
  });
}

function renderStage(){
  const wrap = $('stageWrap');
  wrap.innerHTML = '';
  $('photoActs').innerHTML = '';
  $('legend').innerHTML = '';
  $('baseMsg').className = 'msg';
  $('viewNav').hidden = true;

  const vehicle = fleet.find(v => v.id === vid);
  if (!vehicle) {
    wrap.innerHTML = '<div class="stage"><div class="empty">' +
      (vehicleRequested ? 'הרכב שבקישור לא נמצא. לא הוצגה מפה של רכב אחר.' : 'בחר רכב כדי להציג את מפת הפגיעות.') +
      '</div></div>';
    return;
  }

  const have = viewsOf(views, vid)[side];
  $('viewNav').hidden = false;
  $('viewPrev').disabled = adjacentPhotoSide(views, vid, side, -1) === side;
  $('viewNext').disabled = adjacentPhotoSide(views, vid, side, 1) === side;
  $('viewHint').textContent = sideHe(side) + ' · גרירה מחליפה תמונות צד. הגג נבחר בנפרד.';

  if (!have && vehicle.active === false) {
    wrap.innerHTML = '<div class="stage"><div class="empty">הרכב הוצא מהצי. אין תמונה היסטורית לצד הזה.</div></div>';
    return;
  }

  if (!have) {
    // אין תמונה — אין על מה לסמן. אומרים בדיוק מה חסר ומה
    // הצעד הבא, במקום מסגרת ריקה שנראית כמו תקלה בטעינה.
    const nx = nextToShoot(views, vid);
    wrap.innerHTML =
      '<div class="stage"><div class="empty">' +
      '<div class="big">אין תמונת ' + esc(sideHe(side)) + ' לרכב הזה</div>' +
      '<div class="note">צלם את הרכב מהצד הזה והעלה. אחר כך אפשר ' +
      'לסמן עליו תקלות ופגיעות.' +
      (nx && nx !== side ? '<br>מומלץ להשלים לפי הסדר: ' +
        esc(sideHe(nx)) + ' קודם.' : '') +
      '</div></div></div>';
    if (canAddToVehicle()) addPhotoBtns(sideHe(side), false);
    return;
  }

  const st = document.createElement('div');
  st.className = 'stage' + (canAddToVehicle() ? ' pick' : '');

  const img = document.createElement('img');
  img.className = 'base';
  img.src = have.photo;
  img.alt = 'רכב — ' + sideHe(side);
  img.draggable = false;
  st.appendChild(img);

  const list = sortByTime(pointsOn(faults, vid, side));
  list.forEach(function (f, i) {
    const p = document.createElement('button');
    p.type = 'button';
    p.className = 'pin' + (isOpen(f) ? '' : ' done');
    p.style.insetInlineStart = '';
    p.style.left = (f.x * 100) + '%';
    p.style.top  = (f.y * 100) + '%';
    p.style.setProperty('--pin-color', isOpen(f) ? sevBgColor(f.severity) : 'var(--good)');
    p.textContent = String(i + 1);
    p.title = f.title || '';
    p.setAttribute('aria-label', (i + 1) + '. ' + (f.title || ''));
    p.onclick = function (e) { e.stopPropagation(); openFault(f, i + 1); };
    st.appendChild(p);
  });

  // Gesture state belongs to this exact image/identity, never to a new render.
  let gesture = null, suppressClick = false;
  const targetGeneration = AUTH_GEN, targetVehicle = vid, targetSide = side;
  const currentImage = () => targetGeneration === AUTH_GEN && targetVehicle === vid &&
    targetSide === side && st.isConnected;
  st.addEventListener('pointerdown', e => {
    if (e.target !== img || !e.isPrimary || e.button !== 0) return;
    gesture = { x:e.clientX, y:e.clientY, id:e.pointerId };
    suppressClick = false;
  });
  st.addEventListener('pointerup', e => {
    if (!gesture || gesture.id !== e.pointerId) return;
    const dx = e.clientX - gesture.x, dy = e.clientY - gesture.y;
    gesture = null;
    suppressClick = Math.abs(dx) > 12 || Math.abs(dy) > 12;
    if (currentImage() && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
      e.preventDefault(); navigatePhoto(dx > 0 ? -1 : 1);
    }
  });
  st.addEventListener('pointercancel', () => { gesture = null; suppressClick = true; });
  st.addEventListener('pointerleave', () => { if (gesture) { gesture = null; suppressClick = true; } });
  // A drag must never create a new fault through the synthesized click.
  st.onclick = function (e) {
    if (suppressClick) { suppressClick = false; return; }
    if (!currentImage() || e.target !== img || !canAddToVehicle() || !img.complete || !img.naturalWidth) return;
    const pt = pointAt(img.getBoundingClientRect(), e.clientX, e.clientY);
    newAt(pt);
  };

  wrap.appendChild(st);

  $('legend').innerHTML =
    '<span class="k"><i style="background:' + UNSET.color + '"></i>' +
      esc(UNSET.he) + '</span>' +
    SEVERITIES.map(s => '<span class="k"><i style="background:' + s.color +
      '"></i>' + esc(s.he) + '</span>').join('') +
    '<span class="k"><i style="background:var(--good)"></i>טופלה</span>' +
    '<span class="k">' + list.length + ' נקודות' +
      (canAddToVehicle() ? ' · לחץ על התמונה כדי לדווח' : ' · היסטוריה') + '</span>';

  if (CAN_MANAGE && canAddToVehicle()) addPhotoBtns(sideHe(side), true);
}

function navigatePhoto(direction) {
  const next = adjacentPhotoSide(views, vid, side, direction);
  if (next !== side) { side = next; render(); }
}
$('viewPrev').onclick = () => navigatePhoto(-1);
$('viewNext').onclick = () => navigatePhoto(1);

function addPhotoBtns(subject, warn){
  const choices = [
    { input:'basePick',
      text:(warn ? 'צלם מחדש' : 'צלם') + ' במצלמה · ' + subject,
      primary:true },
    { input:'baseGallery',
      text:(warn ? 'בחר תמונה חלופית' : 'בחר תמונה') + ' מהגלריה · ' + subject,
      primary:false }
  ];
  choices.forEach(function (choice) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn' + (!warn && choice.primary ? ' go' : '');
    b.textContent = choice.text;
    b.dataset.photoSource = choice.input === 'basePick' ? 'camera' : 'gallery';
    b.onclick = function () {
    if (warn && !window.confirm(
      'החלפת התמונה מזיזה את כל הנקודות שכבר סומנו על הצד הזה.\n\n' +
      'הן נשמרות כיחס לתמונה, ולכן בזווית אחרת הן יצביעו על מקום ' +
      'אחר ברכב.\n\nלהחליף?')) return;
      photoTargets.set(choice.input, captureVehicleTarget());
      $(choice.input).click();
    };
    $('photoActs').appendChild(b);
  });
}

function sortByTime(list){
  return (list || []).slice().sort((a, b) =>
    String(a.created_key || '').localeCompare(String(b.created_key || '')));
}

// ---------- העלאת תמונת הרכב ----------

async function uploadBasePhoto(picker){
  const file = picker.files && picker.files[0];
  const target = photoTargets.get(picker.id);
  photoTargets.delete(picker.id);
  picker.value = '';
  if (!file) return;
  if (!target) {
    actionError(new Error('בחירת הרכב התיישנה. יש לבחור רכב ולפתוח שוב את בחירת התמונה.'));
    return;
  }

  msg('מקטין ומעלה…', 'info');
  try {
    requireVehicleTarget(target);
    // 1600 פיקסל ולא 1280 כמו בצילום תקלה: על התמונה הזו
    // מסמנים נקודות באצבע, וכל פיקסל הוא דיוק סימון.
    const im = await shrinkImage(file, 1600, 820 * 1024);
    requireVehicleTarget(target);
    const id = viewId(target.id, target.side);
    const exists = !!viewsOf(views, target.id)[target.side];
    const body = {
      vehicle_id: target.id, side: target.side, photo: im.data, w: im.w, h: im.h,
      by_uid: target.uid, by_name: target.name,
      created_key: new Date().toISOString(), created_at: serverTimestamp()
    };
    // merge כדי שהחלפה לא תמחק את מי שהעלה במקור.
    await setDoc(doc(db, 'stations', target.sid, 'vehicle_views', id), body,
                 exists ? { merge:true } : undefined);
    msg('התמונה נשמרה.', 'ok');
    await loadAll();
  } catch (e) {
    msg('ההעלאה נכשלה. (' + (e.code || e.message || '') + ')', 'err');
    actionError(e);
  }
}

$('basePick').onchange = function () { return uploadBasePhoto(this); };
$('baseGallery').onchange = function () { return uploadBasePhoto(this); };

// ---------- דיווח חדש בנקודה ----------

let NEW_FAULT_MODAL_GEN = 0;
let NEW_FAULT_UPLOAD_LOCKED = false;
function newAt(pt){
  if (!canAddToVehicle()) return;
  const modalGen = ++NEW_FAULT_MODAL_GEN;
  const target = captureVehicleTarget();
  const kinds = FAULT_KINDS.filter(k => k.needsVehicle);
  $('dlgTitle').textContent = 'דיווח חדש · ' + sideHe(side);
  $('dlgHint').textContent =
    'הנקודה נשמרת במקום שלחצת. ראש המשמרת קובע את החומרה אחר כך.';
  $('dlgBody').innerHTML =
    '<label>סוג</label><select id="nKind">' +
      kinds.map(k => '<option value="' + k.id + '">' + esc(k.he) + '</option>').join('') +
    '</select>' +
    '<label>כותרת התקלה</label>' +
    '<input type="text" id="nTitle" maxlength="240" ' +
      'placeholder="למשל: מכה בדופן מאחורי הגלגל">' +
    '<label>תיאור</label><textarea id="nDesc" maxlength="600"></textarea>' +
    '<label>צילומים (לא חובה, ללא מגבלה כוללת)</label>' +
    '<div class="row"><button type="button" class="btn sm" id="nShotCameraBtn">' +
      'צלם במצלמה</button>' +
    '<button type="button" class="btn sm" id="nShotGalleryBtn">' +
      'בחר מהגלריה</button>' +
    '<span class="note" id="nShotName" aria-live="polite">לא נבחרו תמונות</span></div>' +
    '<div id="nShotList"></div>' +
    '<input type="file" id="nShot" accept="image/*" capture="environment" class="hide">' +
    '<input type="file" id="nShotGallery" accept="image/*" multiple class="hide">' +
    '<div class="row"><button class="btn go" id="nSave">שמור דיווח</button>' +
    '<button class="btn" id="nCancel">ביטול</button></div>' +
    '<div class="msg" id="nMsg"></div>';
  $('ov').classList.add('on');

  const photos = createPhotoQueue(Number.POSITIVE_INFINITY);
  const reportId = doc(collection(db, 'stations', target.sid, 'faults')).id;
  const upload = { baseCreated:false, baseSent:false, basePhotos:null, next:0, batch:null, formKey:'' };
  function paintPhotos(){
    const selected = photos.list();
    $('nShotName').textContent = selected.length
      ? selected.length + ' תמונות נבחרו. הן יישמרו באצוות עם התקדמות.'
      : 'לא נבחרו תמונות. אפשר לצלם ולהוסיף אחת בכל פעם.';
    $('nShotList').replaceChildren();
    selected.forEach((file, index) => {
      const row = document.createElement('div'); row.className = 'row';
      const name = document.createElement('span');
      name.textContent = file.name || 'תמונה ' + (index + 1);
      const remove = document.createElement('button');
      remove.type = 'button'; remove.className = 'btn sm'; remove.textContent = 'הסר';
      remove.onclick = () => {
        if (upload.baseCreated) {
          msg('הדיווח כבר נוצר. השלימו את העלאת התמונות.', 'err', 'nMsg'); return;
        }
        photos.remove(index); paintPhotos();
      };
      row.append(name, remove); $('nShotList').appendChild(row);
    });
  }
  function chooseShots(picker){
    if (upload.baseCreated) {
      msg('הדיווח כבר נוצר. השלימו את העלאת התמונות.', 'err', 'nMsg');
      picker.value = ''; return;
    }
    if (!photos.add(picker.files)) msg('לא ניתן לצרף את הקבצים שנבחרו.', 'err', 'nMsg');
    picker.value = '';
    paintPhotos();
  }
  $('nShotCameraBtn').onclick = () => $('nShot').click();
  $('nShotGalleryBtn').onclick = () => $('nShotGallery').click();
  $('nShot').onchange = function () { chooseShots(this); };
  $('nShotGallery').onchange = function () { chooseShots(this); };

  $('nCancel').onclick = () => close();
  $('nSave').onclick = async function (){
    const b = $('nSave');
    const title = $('nTitle').value.trim();
    if (!title) { msg('נא להזין כותרת.', 'err', 'nMsg'); return; }
    const formKey = JSON.stringify({ kind:$('nKind').value, title,
      desc:$('nDesc').value.trim(), count:photos.list().length });
    if (upload.formKey && upload.formKey !== formKey) {
      msg('שליחת הדיווח הקודם טרם הוכרעה. החזירו את פרטי הטופס ונסו שוב.', 'err', 'nMsg');
      return;
    }
    upload.formKey = formKey;
    NEW_FAULT_UPLOAD_LOCKED = true;
    b.disabled = true;
    msg('שומר…', 'info', 'nMsg');
    try {
      requireVehicleTarget(target);
      if (modalGen !== NEW_FAULT_MODAL_GEN) return;
      const files = photos.list();
      if (!upload.baseCreated) {
        if (!upload.basePhotos) {
          const prepared = [];
          for (const file of files.slice(0, 3)) {
            requireVehicleTarget(target);
            const image = await shrinkImage(file);
            prepared.push({ data:image.data, w:image.w, h:image.h });
          }
          upload.basePhotos = prepared;
        }
        requireVehicleTarget(target);
        if (modalGen !== NEW_FAULT_MODAL_GEN) return;
        upload.baseSent = true;
        await createFaultReport({
          stationId:target.sid, expectedUid:target.uid, reportId,
          kind:$('nKind').value, vehicleId:target.id, title,
          desc:$('nDesc').value.trim(), severity:'unset',
          point:{ side:target.side, x:pt.x, y:pt.y }, photos:upload.basePhotos
        });
        if (modalGen !== NEW_FAULT_MODAL_GEN) return;
        upload.baseCreated = true;
        upload.next = upload.basePhotos.length; upload.basePhotos = null;
      }
      while (upload.next < files.length) {
        requireVehicleTarget(target);
        if (!upload.batch) {
          const prepared = [];
          for (const file of files.slice(upload.next, upload.next + 3)) {
            const image = await shrinkImage(file);
            requireVehicleTarget(target);
            prepared.push({ data:image.data, w:image.w, h:image.h });
          }
          upload.batch = { photos:prepared,
            requestId:reportId + '_' + String(upload.next).padStart(8, '0') };
        }
        await appendFaultPhotos({ stationId:target.sid, expectedUid:target.uid,
          reportId, requestId:upload.batch.requestId, photos:upload.batch.photos });
        if (modalGen !== NEW_FAULT_MODAL_GEN) return;
        upload.next += upload.batch.photos.length;
        upload.batch = null;
        msg('נשמרו ' + upload.next + ' מתוך ' + files.length + ' תמונות…', 'info', 'nMsg');
      }
      if (modalGen !== NEW_FAULT_MODAL_GEN) return;
      NEW_FAULT_UPLOAD_LOCKED = false;
      close();
      await loadAll();
    } catch (e) {
      if (modalGen !== NEW_FAULT_MODAL_GEN) return;
      if (!upload.baseSent) NEW_FAULT_UPLOAD_LOCKED = false;
      b.disabled = false;
      msg('ההעלאה לא הושלמה. נשמרו ' + upload.next + ' מתוך ' + photos.list().length +
        ' תמונות. הטופס נשמר; נסו שוב להמשך מאותה אצווה.', 'err', 'nMsg');
    }
  };
}

function toKey(d){
  const m = String(d.getMonth()+1).padStart(2,'0');
  const a = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + m + '-' + a;
}

function close(){
  if (NEW_FAULT_UPLOAD_LOCKED) {
    const status = $('nMsg');
    if (status) status.textContent = 'הדיווח נשלח או נמצא בהעלאה. השלימו את התמונות או נסו שוב; אל תסגרו את הטופס.';
    return;
  }
  NEW_FAULT_MODAL_GEN += 1;
  DETAIL_GEN += 1;
  shotsInflight = {};
  $('ov').classList.remove('on');
  $('dlgBody').replaceChildren();
}
$('dlgX').onclick = close;
$('ov').onclick = e => { if (e.target === $('ov')) close(); };
$('lbX').onclick = () => $('lb').classList.remove('on');
$('lb').onclick = e => { if (e.target !== $('lbImg')) $('lb').classList.remove('on'); };

// ---------- כרטיס נקודה ----------

function openFault(f, n){
  DETAIL_GEN += 1;
  shotsInflight = {};
  $('dlgTitle').textContent = hasPoint(f)
    ? 'נקודה ' + n + ' · ' + sideHe(f.side)
    : 'דיווח רכב ללא מיקום';
  $('dlgHint').textContent = kindHe(f.kind);
  $('dlgBody').innerHTML = '';
  $('dlgBody').appendChild(faultCard(f, n, { loadPhotos:true }));
  $('ov').classList.add('on');
}

function faultCard(f, n, opts){
  opts = opts || {};
  const target = captureFaultTarget(f);
  const open = isOpen(f);
  // בג'ר לרקע רווי (עיגול המספר, פס הצבע בצד הכרטיס) לעומת בג'ר
  // לטקסט חזית (התגית) - לא אותו ערך: --bad-txt (מה ש-sevColor
  // מחזיר לחומרה חוסמת) בטוח כטקסט בשתי הערכות, אבל לא כרקע רווי
  // במצב כהה (ef5350, 3.49:1 עם לבן). ראו ההערה על sevBgColor ב-faults.js.
  const bgCol = open ? sevBgColor(f.severity) : 'var(--good)';
  const txtCol = open ? sevColor(f.severity) : 'var(--good)';
  // .num הבסיסי (בקובץ ה-CSS) הוא #fff קבוע - נכון לרוב הרקעים
  // (warn/note/good), אבל לא ל--bad במצב כהה (ef5350, 3.49:1
  // עם לבן). דריסה נקודתית רק כשהרקע הוא --bad עצמו.
  const numTxt = bgCol === 'var(--bad)' ? 'var(--bad-on)' : '#fff';
  const el = document.createElement('div');
  el.className = 'f' + (open ? '' : ' done');
  el.style.borderInlineStartColor = bgCol;

  el.innerHTML =
    '<div class="top">' +
      '<span class="num" style="background:' + bgCol + ';color:' + numTxt + '">' + n + '</span>' +
      '<span class="ttl">' + esc(f.title || '') + '</span>' +
      '<span class="tag" style="color:' + txtCol + ';border-color:' + bgCol + '">' +
        esc(open ? sevHe(f.severity) : 'טופלה') + '</span>' +
    '</div>' +
    (f.desc ? '<div class="desc">' + esc(f.desc) + '</div>' : '') +
    '<div class="shots"></div>' +
    '<div class="rep">דווח: ' + esc(reportedLine(f)) + '</div>';

  const shotsBox = el.querySelector('.shots');
  const photoCount = Number(f.photos || 0);
  if (opts.loadPhotos) {
    shotsBox.innerHTML = photoCount
      ? '<span class="ld">טוען ' + photoCount + ' תמונות…</span>'
      : '<span class="ld">אין צילום.</span>';
    if (photoCount) loadShots(f, shotsBox);
  } else if (photoCount > 0) {
    // F-01: list / renderList — count-only skeleton, no getDocs(/photos).
    shotsBox.innerHTML = '<span class="ld">' + photoCount + ' תמונות</span>';
  }

  const acts = document.createElement('div');
  acts.className = 'acts';
  if (!opts.loadPhotos) {
    const detail = btn('הצג פרטים ותמונות', 'btn sm', () => openFault(f, n));
    detail.setAttribute('aria-label', 'הצג פרטים ותמונות · ' + String(f.title || 'דיווח רכב'));
    acts.appendChild(detail);
  }
  if (opts.loadPhotos && f.by_uid === ME.uid) {
    const detailGen = DETAIL_GEN;
    const picker = document.createElement('input');
    picker.type = 'file'; picker.accept = 'image/*'; picker.multiple = true;
    picker.hidden = true;
    const status = document.createElement('span');
    status.className = 'note'; status.setAttribute('role', 'status');
    let upload = null;
    const uploadButton = btn('צרף תמונות לתקלה זו', 'btn sm', () => {
      if (upload) void send(); else picker.click();
    });
    async function send() {
      if (!upload) return;
      uploadButton.disabled = true;
      try {
        requireFaultTarget(target);
        while (upload.next < upload.files.length) {
          if (detailGen !== DETAIL_GEN) return;
          const offset = upload.next;
          if (!upload.batch) {
            const photos = [];
            for (const file of upload.files.slice(offset, offset + 3)) {
              const image = await shrinkImage(file);
              requireFaultTarget(target);
              if (detailGen !== DETAIL_GEN) return;
              photos.push({ data:image.data, w:image.w, h:image.h });
            }
            upload.batch = { photos, requestId:upload.id + '_' + offset };
          }
          await appendFaultPhotos({ stationId:target.sid, expectedUid:target.uid,
            reportId:target.id, requestId:upload.batch.requestId,
            photos:upload.batch.photos });
          if (detailGen !== DETAIL_GEN) return;
          requireFaultTarget(target);
          upload.next += upload.batch.photos.length;
          upload.batch = null;
          if (status.isConnected) status.textContent = 'נשמרו ' + upload.next +
            ' מתוך ' + upload.files.length + ' תמונות.';
        }
        upload = null;
        if (detailGen === DETAIL_GEN) await loadAll();
      } catch (error) {
        if (detailGen === DETAIL_GEN && status.isConnected) status.textContent =
          'ההעלאה לא הושלמה. לחצו שוב להמשך; אחרי רענון בחרו רק את התמונות החסרות.';
      } finally { if (detailGen === DETAIL_GEN) uploadButton.disabled = false; }
    }
    picker.onchange = () => {
      if (!picker.files?.length || detailGen !== DETAIL_GEN) return;
      upload = { id:crypto.randomUUID(), files:Array.from(picker.files),
        next:0, batch:null };
      picker.value = '';
      void send();
    };
    acts.append(uploadButton, picker, status);
  }

  // דירוג — סגל בלבד. הכבאי מתאר מה ראה; כמה זה חמור זו
  // החלטה מבצעית של ראש המשמרת.
  if (knownFaultVehicle(f) && CAN_MANAGE && open) {
    const sel = document.createElement('select');
    sel.style.width = 'auto';
    sel.innerHTML = '<option value="unset">' + esc(UNSET.he) + '</option>' +
      SEVERITIES.map(s => '<option value="' + s.id + '">' + esc(s.he) +
        '</option>').join('');
    sel.value = needsGrading(f) ? 'unset' : f.severity;
    sel.onchange = () => grade(f, sel.value, sel, target);
    acts.appendChild(sel);
  }

  if (knownFaultVehicle(f) && open && (CAN_MANAGE || f.by_uid === ME.uid)) {
    acts.appendChild(btn('סגור', 'btn sm', () => closeFault(f, target)));
  }
  if (knownFaultVehicle(f) && CAN_MANAGE && isDamage(f)) {
    acts.appendChild(btn('מחק פגיעה', 'btn sm', () => wipe(f, target)));
  }
  if (acts.children.length) el.appendChild(acts);
  return el;
}

function btn(t, cls, fn){
  const b = document.createElement('button');
  b.className = cls; b.textContent = t; b.onclick = fn;
  return b;
}

async function loadShots(f, box){
  // F-01: cache key MUST be stationId+faultId (match faults.html).
  // AUTH_GEN + late-response discard before cache write AND before paint.
  if (!Number(f.photos || 0)) { box.innerHTML = '<span class="ld">אין צילום.</span>'; return; }
  const reqSid = SID;
  const reqGen = AUTH_GEN;
  const reqDetail = DETAIL_GEN;
  const key = String(reqSid || '') + ':' + String(f.id || '');
  if (shots[key]) { paint(shots[key], box); moreShots(key, f, box, reqSid, reqGen, reqDetail); return; }
  if (!shotsInflight[key]) {
    const request = getDocs(query(collection(db, 'stations', reqSid, 'faults', f.id, 'photos'),
      orderBy(documentId()), limit(11)))
      .then(function (s) {
        const page = s.docs.slice(0, 10);
        const list = page.map(d => d.data() || {});
        if (SID !== reqSid || AUTH_GEN !== reqGen || DETAIL_GEN !== reqDetail ||
            shotsInflight[key] !== request) {
          return { list: list, reqSid: reqSid, reqGen: reqGen, stale: true };
        }
        shots[key] = list;
        shotsPages[key] = { cursor:page.at(-1) || null, more:s.docs.length > 10 };
        return { list: list, reqSid: reqSid, reqGen: reqGen, stale: false };
      })
      .finally(function () {
        if (shotsInflight[key] === request) delete shotsInflight[key];
      });
    shotsInflight[key] = request;
  }
  try {
    const result = await shotsInflight[key];
    if (!result || result.stale || SID !== reqSid || AUTH_GEN !== reqGen ||
        DETAIL_GEN !== reqDetail || !box.isConnected ||
        result.reqSid !== SID || result.reqGen !== AUTH_GEN) {
      return;
    }
    paint(result.list, box);
    moreShots(key, f, box, reqSid, reqGen, reqDetail);
  } catch (e) {
    if (SID !== reqSid || AUTH_GEN !== reqGen || DETAIL_GEN !== reqDetail || !box.isConnected) return;
    box.replaceChildren();
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'btn sm';
    retry.textContent = 'הצילומים לא נטענו · נסה שוב';
    retry.onclick = () => {
      if (SID !== reqSid || AUTH_GEN !== reqGen || DETAIL_GEN !== reqDetail || !box.isConnected) return;
      box.textContent = 'טוען תמונות…';
      void loadShots(f, box);
    };
    box.appendChild(retry);
  }
}

function moreShots(key, fault, box, reqSid, reqGen, reqDetail) {
  const state = shotsPages[key];
  if (!state?.more || !state.cursor) return;
  const button = btn('עוד תמונות', 'btn sm', async () => {
    if (SID !== reqSid || AUTH_GEN !== reqGen || DETAIL_GEN !== reqDetail || !box.isConnected) return;
    button.disabled = true;
    try {
      const snap = await getDocs(query(collection(db, 'stations', reqSid,
        'faults', fault.id, 'photos'), orderBy(documentId()),
        startAfter(state.cursor), limit(11)));
      if (SID !== reqSid || AUTH_GEN !== reqGen || DETAIL_GEN !== reqDetail ||
          !box.isConnected || shotsPages[key] !== state) return;
      const page = snap.docs.slice(0, 10);
      state.cursor = page.at(-1) || null; state.more = snap.docs.length > 10;
      shots[key].push(...page.map(d => d.data() || {}));
      paint(shots[key], box); moreShots(key, fault, box, reqSid, reqGen, reqDetail);
    } catch (error) {
      if (SID === reqSid && AUTH_GEN === reqGen && DETAIL_GEN === reqDetail && box.isConnected) {
        button.textContent = 'לא נטען · נסו שוב'; button.disabled = false;
      }
    }
  });
  box.append(button);
}

function paint(list, box){
  box.innerHTML = '';
  if (!list.length) { box.innerHTML = '<span class="ld">אין צילום.</span>'; return; }
  list.forEach(function (p) {
    if (!p || !p.data) return;
    const im = document.createElement('img');
    im.src = p.data; im.alt = 'צילום המכה';
    im.onclick = () => { $('lbImg').src = p.data; $('lb').classList.add('on'); };
    box.appendChild(im);
  });
}

async function grade(f, sev, sel, target){
  sel.disabled = true;
  try {
    requireFaultTarget(target);
    await setDoc(doc(db, 'stations', target.sid, 'faults', target.id), {
      severity: sev, graded_by: target.uid, graded_by_name: target.name,
      graded_key: new Date().toISOString()
    }, { merge:true });
    close(); await loadAll();
  } catch (e) { sel.disabled = false; actionError(e); }
}

async function closeFault(f, target){
  const what = window.prompt('מה נעשה? (אפשר להשאיר ריק)', '');
  if (what === null) return;
  try {
    requireFaultTarget(target);
    await setDoc(doc(db, 'stations', target.sid, 'faults', target.id), {
      status:'fixed', fix_note:String(what || '').slice(0,300),
      fixed_by: target.uid, fixed_by_name: target.name,
      fixed_key: new Date().toISOString(), fixed_at: serverTimestamp()
    }, { merge:true });
    close(); await loadAll();
  } catch (e) { actionError(e); }
}

async function wipe(f, target){
  if (!window.confirm('למחוק את "' + (f.title || '') + '"?\n\n' +
      DAMAGE_DELETE_WHY + '\n\nלמחוק?')) return;
  try {
    requireFaultTarget(target);
    try {
      const ps = await getDocs(
        collection(db, 'stations', target.sid, 'faults', target.id, 'photos'));
      for (const d of ps.docs) {
        requireFaultTarget(target);
        await deleteDoc(doc(db,'stations',target.sid,'faults',target.id,'photos',d.id));
      }
    } catch (ignore) {}
    requireFaultTarget(target);
    await deleteDoc(doc(db, 'stations', target.sid, 'faults', target.id));
    delete shots[String(target.sid || SID || '') + ':' + String(target.id || '')];
    close(); await loadAll();
  } catch (e) { actionError(e); }
}

// ---------- הרשימה מתחת ----------

function renderList(){
  const box = $('list');
  box.innerHTML = '';

  const onMap = sortByTime(pointsOn(faults, vid, side));
  const other = sortFaults((faults || []).filter(f =>
    f.vehicle_id === vid && !hasPoint(f)));

  $('listNote').textContent = onMap.length
    ? onMap.length + ' נקודות על ' + sideHe(side) +
      (other.length ? ' · ועוד ' + other.length + ' דיווחים בלי מיקום.' : '.')
    : 'אין דיווח על ' + sideHe(side) + '.' +
      (other.length ? ' יש ' + other.length + ' דיווחים בלי מיקום.' : '');

  onMap.forEach((f, i) => box.appendChild(faultCard(f, i + 1)));

  // דיווחים שנפתחו לפני שהיו תמונות, או ממסך התקלות. הם
  // שייכים לרכב אבל אין להם נקודה — ולכן הם מוצגים כאן
  // ולא נעלמים.
  if (other.length) {
    const h = document.createElement('div');
    h.className = 'note';
    h.style.margin = '18px 0 0';
    h.style.paddingTop = '12px';
    h.style.borderTop = '1px solid var(--line)';
    h.innerHTML = '<b>בלי מיקום על המפה</b><br>' +
      'דווחו ממסך התקלות או לפני שהועלו התמונות.';
    box.appendChild(h);
    other.forEach(f => box.appendChild(faultCard(f, '·')));
  }
}
